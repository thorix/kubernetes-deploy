image:
  repository: harbor.thorix.io/library/image-inquisitor
  # v0.2.0 adds ageDays to the vulnerability report, so image age can be sorted
  # and colour-coded rather than only displayed as a timestamp.
  #
  # v0.3.0 adds runningTag/latestSemverTag/upgradeState to the VULNERABILITY
  # report. Those already existed on the registry report, but a CVE count is
  # only actionable next to "is there anything newer to move to" -- 61% of this
  # cluster's criticals sit on images already running the newest tag their
  # registry knows about. Carrying it on the same record removes a join in every
  # consumer; in Grafana that join was across two queries whose keys repeat once
  # per scan, which is unreliable.
  #
  # v0.3.1 makes upgradeState ALWAYS present. v0.3.0 only set it when a registry
  # report existed, which left 19 of 122 images (103 criticals) with no field at
  # all -- and Loki drops records with a missing label from a label filter, so
  # those would have silently vanished from the filtered "needs attention" view.
  tag: v0.3.1-thorix
  pullPolicy: IfNotPresent

cronjob:
  # Once a day, deliberately. Each run refreshes the Trivy vulnerability DB, and
  # keeping that to one pull per day is the whole reason for the cache PVC and
  # the Harbor-proxied DB repository below.
  schedule: "0 15 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  # Scanning ~120 images takes a while; do not let a run be reaped mid-scan.
  activeDeadlineSeconds: 10800

sourceID: rye-cluster

# Reports emitted as JSON on stdout, one object per line, for Alloy -> Loki.
reportOutputs: "summary,imageSummary,imageRegistry,imageVulnerabilities,imageKubernetes"

# Self-hosted registries cannot be auto-detected; without this, everything
# served from Harbor reports a bare tag with no age.
harborRegistries: "harbor.thorix.io"

excludeNamespaces: ""

trivy:
  # Persisted so the DB is not re-downloaded on every run. Trivy refreshes it
  # when older than 6h, so a daily schedule means one refresh per run.
  cacheSize: 5Gi
  storageClass: longhorn
  # Pull the DB through Harbor's ghcr proxy rather than ghcr.io directly. Harbor
  # caches it (ghcr-cache/aquasecurity/trivy-db), so repeated pulls are served
  # locally and never hit GHCR's anonymous rate limits.
  dbRepository: harbor.thorix.io/ghcr-cache/aquasecurity/trivy-db

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 3Gi

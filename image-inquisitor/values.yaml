image:
  repository: harbor.lan/library/image-inquisitor
  # v0.2.0 adds ageDays to the vulnerability report, so image age can be sorted
  # and colour-coded rather than only displayed as a timestamp.
  #
  # v0.3.0 adds runningTag/latestSemverTag/upgradeState to the VULNERABILITY
  # report. Those already existed on the registry report, but a CVE count is
  # only actionable next to "is there anything newer to move to" -- 61% of this
  # cluster's criticals sit on images already running the newest tag their
  # registry knows about. Carrying it on the same record removes a join in every
  # consumer; in Grafana that join was across two queries whose keys repeat once
  # per scan, which is unreliable.
  #
  # v0.3.1 makes upgradeState ALWAYS present. v0.3.0 only set it when a registry
  # report existed, which left 19 of 122 images (103 criticals) with no field at
  # all -- and Loki drops records with a missing label from a label filter, so
  # those would have silently vanished from the filtered "needs attention" view.
  #
  # v0.3.2 omits ageDays entirely when the image's created date is unusable,
  # instead of reporting 0. registry.k8s.io/external-dns pins created to the Unix
  # epoch for reproducible builds, so it rendered as "0 day" old beside its own
  # 1970 build date and sorted to the top of any age-ascending view. A blank cell
  # is the only honest rendering of "we do not know".
  #
  # v0.4.0 fixes the registry report the same two ways the vulnerability report
  # was fixed: zero/epoch timestamps are omitted instead of serialising as
  # "0000-12-31", and upgradeState is emitted so the drift panel can be filtered
  # like the CVE panel. The current/check/unknown comparison now lives in exactly
  # one place rather than being duplicated between the two reports.
  #
  # v0.5.0 stops emitting the full per-CVE list by default. That array was 27 MB
  # of a 27 MB scan -- effectively the whole payload -- and pushed 22 lines past
  # Loki's 256 KB max_line_size, which drops them at ingest silently. Because line
  # size scales with CVE count, the dropped images were the ones with the MOST
  # vulnerabilities: Loki held 104 of 121, and open-webui (57 criticals, the
  # largest actionable item here) was never ingested at all. Largest line falls
  # from 7117 KB to 0.7 KB. Re-enable with --vulnerability-detail if ever needed.
  #
  # v0.5.1 fixes a regression in v0.5.0: Total.AddSeverity sat after the per-CVE
  # append, so gating the append also stopped the counting and a scan reporting
  # 499 criticals came back with 1. Counting now happens before the detail gate;
  # the flag controls payload only and never the numbers.
  #
  # v0.6.0 publishes scan results as Prometheus metrics alongside the logs, and
  # adds scan_timestamp/images_scanned/scan_duration so a CronJob that stops
  # running becomes visible -- there is no pod to alert on today, so the data
  # simply stops changing while the dashboards keep rendering the last result.
  #
  # v0.7.0 publishes latest_tag_age_days, which separates "somebody needs to act"
  # from "this fixes itself": Renovate holds every update for minimumReleaseAge
  # before opening a PR, so criticals on an image whose newest tag shipped
  # yesterday are already handled, while ones available for months are not. On
  # this cluster that splits 81 criticals still soaking from 147 where the release
  # has been sitting available.
  #
  # v0.8.0 accounts for every image in the inventory: each is either scanned or
  # counted as failed, by phase (parse, list, registry, trivy), and every network
  # call has a deadline. Metrics gain per-image workload mapping,
  # fixable-vulnerability counts and an image_repo label. The exit code separates
  # a meaningless scan (non-zero) from a partial one (zero, surfaced through
  # metrics).
  tag: v0.8.0-thorix
  pullPolicy: IfNotPresent

cronjob:
  # Once a day. Each run refreshes the Trivy vulnerability DB and the Java DB
  # once, before scanning starts; the cache PVC and the Harbor-proxied DB
  # repositories below keep those refreshes cheap.
  schedule: "0 15 * * *"
  # A run that has not started within an hour of its slot is skipped rather than
  # started late.
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  # Covers both init containers and the scan.
  activeDeadlineSeconds: 3600
  # Finished Jobs are deleted after a week at most; the history limits above
  # can remove them sooner.
  ttlSecondsAfterFinished: 604800

sourceID: rye-cluster

# Reports emitted as JSON on stdout, one object per line, for Alloy -> Loki.
reportOutputs: "summary,imageSummary,imageRegistry,imageVulnerabilities,imageKubernetes"

# Self-hosted registries cannot be auto-detected; without this, everything
# served from Harbor reports a bare tag with no age.
harborRegistries: "harbor.lan"

# Publish scan results as metrics in addition to the log reports.
#
# Logs have no concept of current state: every panel has to ask "which scan falls
# in this window", and that question caused a string of wrong answers -- a window
# shorter than the daily scan interval was empty 18 hours a day, one exactly equal
# to it went blank while a scan ran, and a wider one needed deduplication. Logs
# also drop oversized lines at ingest silently, which had been discarding the
# images with the MOST vulnerabilities.
#
# Metrics carry last-value semantics, so none of that applies. Roughly 850 series
# for ~120 images. Empty disables publishing; the log reports are unaffected
# either way and remain the system of record.
metricsEndpoint: ""

excludeNamespaces: ""

trivy:
  # Holds the Trivy vulnerability DB and the Java DB between runs. Longhorn can
  # expand a volume but never shrink it, so this value only ever goes up; raise
  # it in its own change, never inside a chart bump that might be reverted.
  cacheSize: 15Gi
  storageClass: longhorn
  # Pull the DB through Harbor's ghcr proxy rather than ghcr.io directly. Harbor
  # caches it (ghcr-cache/aquasecurity/trivy-db), so repeated pulls are served
  # locally and never hit GHCR's anonymous rate limits.
  dbRepository: harbor.lan/ghcr-cache/aquasecurity/trivy-db
  # The Java DB, used to identify jar files, through the same proxy.
  javaDbRepository: harbor.lan/ghcr-cache/aquasecurity/trivy-java-db

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 3Gi

# external-dns with OPNsense webhook provider (sidecar)

sources:
  - service
  - ingress
  - gateway-httproute
  - crd

domainFilters:
  - rye

policy: sync
registry: txt
txtOwnerId: external-dns
txtPrefix: _external-dns.

interval: 1m
logLevel: info
logFormat: text

extraArgs:
  - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
  - --crd-source-kind=DNSEndpoint
  # Pin the annotation prefix rather than inheriting the upstream default.
  # external-dns is switching its default from external-dns.alpha.kubernetes.io/
  # to external-dns.kubernetes.io/ (kubernetes-sigs/external-dns#6424, in app
  # v0.22.0). On a release that flips the default, any annotation still written
  # with the old prefix silently stops being seen as a source — and with
  # `policy: sync` above, records whose source disappears are DELETED, not left
  # alone. Setting this explicitly makes the upgrade a no-op either way.
  # No annotations currently use it; this keeps it that way by choice, not luck.
  - --annotation-prefix=external-dns.alpha.kubernetes.io/

provider:
  name: webhook
  webhook:
    # Pinned, never a floating tag.
    image:
      repository: ghcr.io/crutonjohn/external-dns-opnsense-webhook
      tag: v1.0.0
      pullPolicy: IfNotPresent
    env:
      - name: LOG_LEVEL
        value: info
      - name: SERVER_HOST
        value: "0.0.0.0"
      - name: OPNSENSE_HOST
        valueFrom:
          secretKeyRef:
            name: external-dns-opnsense-secret
            key: api-url
      - name: OPNSENSE_API_KEY
        valueFrom:
          secretKeyRef:
            name: external-dns-opnsense-secret
            key: api-key
      - name: OPNSENSE_API_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-opnsense-secret
            key: api-secret
    args:
      - --port=8888
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
      initialDelaySeconds: 5
      periodSeconds: 5
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

serviceAccount:
  name: external-dns

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

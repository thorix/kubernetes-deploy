# Omada SDN Controller
# Manages TP-Link EAP access points
# Reachable on a LoadBalancer VIP so the address survives rescheduling

workloadType: StatefulSet

image:
  repository: mbentley/omada-controller
  tag: "5.14.32.2"
  pullPolicy: IfNotPresent

replicaCount: 1

# Pod networking, not hostNetwork: devices reach the controller on a
# LoadBalancer VIP, so its address no longer depends on which node runs it.
# Same-subnet UDP broadcast discovery is lost, which costs nothing here — the
# access point is on another subnet and has always used a configured
# controller address. Devices added to the node subnet would need DHCP
# option 138 or manual adoption.

# All ports the Omada controller needs
ports:
  - name: mgmt-https
    containerPort: 8043
    protocol: TCP
  - name: mgmt-http
    containerPort: 8088
    protocol: TCP
  - name: portal-https
    containerPort: 8843
    protocol: TCP
  - name: discovery
    containerPort: 29810
    protocol: UDP
  - name: app-discovery
    containerPort: 27001
    protocol: UDP
  - name: manager-v1
    containerPort: 29811
    protocol: TCP
  - name: adopt-v1
    containerPort: 29812
    protocol: TCP
  - name: upgrade-v1
    containerPort: 29813
    protocol: TCP
  - name: manager-v2
    containerPort: 29814
    protocol: TCP
  - name: transfer-v2
    containerPort: 29815
    protocol: TCP
  - name: rtty
    containerPort: 29816
    protocol: TCP

# Service fronts the controller for both the web UI (via HTTPRoute) and for
# device traffic from access points, which reaches it on the LoadBalancer VIP.
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: mgmt-https
      port: 8043
      targetPort: 8043
      protocol: TCP
    - name: mgmt-http
      port: 8088
      targetPort: 8088
      protocol: TCP
    - name: portal-https
      port: 8843
      targetPort: 8843
      protocol: TCP
    - name: discovery
      port: 29810
      targetPort: 29810
      protocol: UDP
    - name: app-discovery
      port: 27001
      targetPort: 27001
      protocol: UDP
    - name: manager-v1
      port: 29811
      targetPort: 29811
      protocol: TCP
    - name: adopt-v1
      port: 29812
      targetPort: 29812
      protocol: TCP
    - name: upgrade-v1
      port: 29813
      targetPort: 29813
      protocol: TCP
    - name: manager-v2
      port: 29814
      targetPort: 29814
      protocol: TCP
    - name: transfer-v2
      port: 29815
      targetPort: 29815
      protocol: TCP
    - name: rtty
      port: 29816
      targetPort: 29816
      protocol: TCP

# Environment variables matching the current container config
env:
  - name: MANAGE_HTTP_PORT
    value: "8088"
  - name: MANAGE_HTTPS_PORT
    value: "8043"
  - name: PORTAL_HTTP_PORT
    value: "8088"
  - name: PORTAL_HTTPS_PORT
    value: "8843"
  - name: PORT_ADOPT_V1
    value: "29812"
  - name: PORT_APP_DISCOVERY
    value: "27001"
  - name: PORT_DISCOVERY
    value: "29810"
  - name: PORT_MANAGER_V1
    value: "29811"
  - name: PORT_MANAGER_V2
    value: "29814"
  - name: PORT_RTTY
    value: "29816"
  - name: PORT_TRANSFER_V2
    value: "29815"
  - name: PORT_UPGRADE_V1
    value: "29813"
  - name: PUID
    value: "508"
  - name: PGID
    value: "508"
  - name: SHOW_SERVER_LOGS
    value: "true"
  - name: SHOW_MONGODB_LOGS
    value: "false"
  - name: SSL_CERT_NAME
    value: "tls.crt"
  - name: SSL_KEY_NAME
    value: "tls.key"
  - name: TZ
    value: "Etc/UTC"

# Persistent storage on Longhorn
volumeClaimTemplates:
  - name: data
    mountPath: /opt/tplink/EAPController/data
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    size: 5Gi
  - name: logs
    mountPath: /opt/tplink/EAPController/logs
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    size: 1Gi

# TCP probe on management HTTPS port — Omada doesn't have a simple health endpoint
probes:
  enabled: true
  liveness:
    type: tcp
    port: 8043
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
  readiness:
    type: tcp
    port: 8043
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Omada controller needs room — it runs MongoDB + Java.
# 1Gi OOMKilled the container repeatedly once real data was migrated in;
# MongoDB's cache grows with the dataset, so the ceiling has to clear it.
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    memory: 2Gi

# Run as the same UID/GID the container expects
podSecurityContext:
  fsGroup: 508

serviceAccount:
  create: true

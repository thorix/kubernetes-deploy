{{- /*
  KubernetesAuthEngineConfig — configures Vault's Kubernetes auth backend.

  Leaving kubernetesHost, kubernetesCACert, and tokenReviewerServiceAccount
  unset so Vault uses its own pod SA token and in-cluster CA cert. This
  survives cluster resets because no static JWT is stored in Vault config.
*/ -}}
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineConfig
metadata:
  name: kubernetes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  connection:
    address: http://vault.vault.svc.cluster.local:8200
    tLSConfig:
      skipVerify: true
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: default
  path: kubernetes

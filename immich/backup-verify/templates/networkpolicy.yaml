apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-backup-verify
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: immich-backup-verify
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich-backup-verify
  egress:
  # DNS resolution
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # SMB/NAS access
  - toEntities:
    - host
    - remote-node

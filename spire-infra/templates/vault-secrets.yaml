{{- if .Values.vault.enabled }}
---
# Upstream CA (tls.crt + tls.key) for the SPIRE server's upstreamAuthority.disk
# plugin. The chart mounts this Secret at /run/spire/upstream_ca.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "spire-wrapper.upstreamCASecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-wrapper.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Release.Name }}-auth
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.secrets.upstreamCA }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ include "spire-wrapper.upstreamCASecret" . }}
    create: true
    transformation:
      # Keep only tls.crt and tls.key; skip VSO's _raw copy of the payload.
      excludeRaw: true
{{- end }}

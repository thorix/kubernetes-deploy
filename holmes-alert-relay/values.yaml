# holmes-alert-relay: Alertmanager -> HolmesGPT -> Vikunja for CRITICAL alerts.
# The stdlib relay (mounted from a ConfigMap) runs on python:3.12-slim. It lives
# in the victoriametrics namespace to sit next to Alertmanager. Investigations
# run one-at-a-time (the local model is slow) and are critical-only + de-duped by
# alertname+namespace. Holmes root-causes are filed as Vikunja tasks (one task
# per distinct problem; commented on recurrence; closed when the alert resolves)
# so chronic issues are tracked work-items rather than repeated Slack messages.
# The existing raw Alertmanager->Slack pager is untouched and fires independently.
workloadType: Deployment
replicaCount: 1

image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

command: ["python", "/app/relay.py"]

# The relay reads /app/relay.py once at process start, so updating the
# ConfigMap alone changes the file on disk while the running pod keeps
# executing the old code -- a merged fix that silently never takes effect.
# Bump this whenever configMap.files.relay.py changes, same as frigate.
podAnnotations:
  configmap-hash: "20261031-relay-work-orders"

env:
  - name: HOLMES_URL
    value: "http://holmesgpt-holmes.holmesgpt.svc/api/chat"
  - name: RELAY_SEVERITIES
    value: "critical"
  # De-dup window: a persistent problem (e.g. a crashlooping pod) is investigated
  # at most once per this many minutes, keyed by alertname+namespace.
  - name: DEDUP_MINUTES
    value: "120"
  - name: HOLMES_TIMEOUT
    value: "900"
  - name: PORT
    value: "8080"
  # A resolved alert closes its task only after staying resolved this long; a
  # firing in the window cancels the close, so a flapping alert never churns.
  - name: CLOSE_GRACE_MINUTES
    value: "10"
  # Work orders (investigate=false alerts) close only after staying resolved
  # this long: longer than the alert's `for: 1h`, so a rule reload never closes one.
  - name: WORK_ORDER_CLOSE_GRACE_MINUTES
    value: "180"
  - name: ALERTMANAGER_URL
    value: "http://vmalert-victoria-metrics-alert-alertmanager:9093"
  - name: WORK_ORDER_MARKER_STYLE
    value: "comment"
  # A problem firing again after its task closed reopens that task (rather than
  # making a new one) if it closed within this many hours.
  - name: REOPEN_WINDOW_HOURS
    value: "24"
  # Vikunja API base + the "Cluster Alerts" project (id 8) tasks are filed into.
  - name: VIKUNJA_URL
    value: "http://vikunja-simple-service.vikunja.svc:3456/api/v1"
  - name: VIKUNJA_PROJECT_ID
    value: "8"
  # Long-lived Vikunja API token. NOTE: this secret (holmes-relay-vikunja) is
  # created manually, out of GitOps — it holds a personal API token that is not in
  # Vault. Re-create it if the namespace is rebuilt. (Vault-ify as a follow-up.)
  - name: VIKUNJA_TOKEN
    valueFrom:
      secretKeyRef:
        name: holmes-relay-vikunja
        key: VIKUNJA_TOKEN

configMap:
  enabled: true
  mountPath: /app
  files:
    relay.py: |
      #!/usr/bin/env python3
      """Alertmanager -> HolmesGPT -> Vikunja relay.

      Alertmanager POSTs alerts to /alert. For each *firing* alert whose severity is
      in RELAY_SEVERITIES, this asks HolmesGPT to investigate the root cause and files
      it as a task in a Vikunja project — ONE task per distinct problem
      (alertname+namespace), so a chronic issue is a single tracked ticket rather than
      a stream of Slack messages. When the alert *resolves*, the task is closed.

      Why tickets, not Slack: a Holmes root-cause is actionable work, and chronic
      alerts (a pod OOMing for days) should be one item you track to done, not a
      message re-posted every couple hours. The raw Alertmanager->Slack path still
      fires independently as the real-time pager; this is the durable work-item side.

      Design:
      - Investigations are slow (local model), so ONE runs at a time (a single worker
        draining a bounded queue), de-duped by alertname+namespace for DEDUP_MINUTES.
      - Task lifecycle (one task per alertname+namespace):
          * first firing            -> create task with the root cause
          * fires again while open   -> add a comment (so you can see it's chronic)
          * fires again after close  -> reopen the same task if it closed within
                                        REOPEN_WINDOW_HOURS, else a fresh task
          * resolved                 -> arm a close; the reaper closes the task only
                                        after CLOSE_GRACE_MINUTES of staying resolved,
                                        and any firing in that window cancels it (so a
                                        flapping alert never churns tickets).
      - Work orders (alerts labelled investigate="false" with a work_order label, e.g.
        an image-upgrade request) skip Holmes entirely and bypass RELAY_SEVERITIES:
          * their own queue and worker (never the Holmes queue or dedup map)
          * firing   -> create the task from the alert text, or comment only when the
                        image list changed since the last relay marker (idempotent)
          * resolved -> arm a close with WORK_ORDER_CLOSE_GRACE_MINUTES; the reaper
                        only hands it to the work-order worker, which re-checks the
                        pending entry and holds the close while the inventory scan
                        reports itself incomplete for that namespace (or Alertmanager
                        is unreachable)
          * startup  -> a one-shot reconcile schedules closes for open work-order
                        tasks that no longer have an active alert
      - stdlib only (runs on python:3.12-slim from a ConfigMap; no image build).
      """
      from __future__ import annotations

      import hashlib
      import html
      import json
      import logging
      import os
      import queue
      import re
      import threading
      import time
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
      log = logging.getLogger("relay")

      HOLMES_URL = os.environ.get("HOLMES_URL", "http://holmesgpt-holmes.holmesgpt.svc/api/chat")
      HOLMES_TIMEOUT = int(os.environ.get("HOLMES_TIMEOUT", "900"))  # seconds; local model is slow
      RELAY_SEVERITIES = {s.strip().lower() for s in os.environ.get("RELAY_SEVERITIES", "critical").split(",") if s.strip()}
      DEDUP_MINUTES = int(os.environ.get("DEDUP_MINUTES", "120"))

      VIKUNJA_URL = os.environ.get("VIKUNJA_URL", "http://vikunja-simple-service.vikunja.svc:3456/api/v1")
      VIKUNJA_TOKEN = os.environ.get("VIKUNJA_TOKEN", "")
      VIKUNJA_PROJECT_ID = os.environ.get("VIKUNJA_PROJECT_ID", "8")

      # A resolved alert does not close its task immediately: it arms a pending close
      # that the reaper acts on only after the problem has stayed resolved this long.
      # Any firing in the window cancels it, so a flapping alert never churns tickets.
      CLOSE_GRACE_MINUTES = int(os.environ.get("CLOSE_GRACE_MINUTES", "10"))
      # When a problem fires again after its task was closed, reopen that task (instead
      # of creating a new one) if it was closed within this many hours. Beyond the
      # window, a recurrence gets a fresh ticket with its own investigation history.
      REOPEN_WINDOW_HOURS = int(os.environ.get("REOPEN_WINDOW_HOURS", "24"))

      # Work orders (investigate="false" + work_order label): no Holmes, own queue.
      # Longer than the alert's own `for:` so a rule reload never closes a work order.
      WORK_ORDER_CLOSE_GRACE_MINUTES = int(os.environ.get("WORK_ORDER_CLOSE_GRACE_MINUTES", "180"))
      ALERTMANAGER_URL = os.environ.get("ALERTMANAGER_URL", "http://vmalert-victoria-metrics-alert-alertmanager:9093")
      WORK_ORDER_MARKER_STYLE = os.environ.get("WORK_ORDER_MARKER_STYLE", "comment")  # comment | visible
      WORK_ORDER_ALERTNAMES = {"ImageUpgradeAvailable"}
      HOLD_ALERTNAME = "ImageInquisitorInventoryIncomplete"

      MAX_QUEUE = int(os.environ.get("MAX_QUEUE", "20"))
      PORT = int(os.environ.get("PORT", "8080"))

      _work: "queue.Queue[dict]" = queue.Queue(maxsize=MAX_QUEUE)
      _seen: dict[str, float] = {}          # dedup key -> last-enqueued epoch
      _seen_lock = threading.Lock()
      # identity key -> (close-deadline epoch, task title, kind, namespace). A resolved
      # alert arms an entry here; a firing cancels it; the reaper closes a "holmes"
      # task once the deadline passes, and hands a "wo" task to the work-order worker.
      # Guarded by _pending_lock.
      _pending_close: dict[str, tuple[float, str, str, str]] = {}
      _pending_lock = threading.Lock()
      _wo_queue: "queue.Queue[tuple]" = queue.Queue(maxsize=200)
      _wo_close_enqueued: set[str] = set()   # keys with a ("close", key) in flight


      # ── HTTP helpers ─────────────────────────────────────────────────────────────

      def _post_json(url: str, payload: dict, timeout: int) -> str:
          req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=timeout) as resp:
              return resp.read().decode("utf-8", "replace")


      def _vk(method: str, path: str, payload: dict | None = None):
          """Call the Vikunja API. Returns parsed JSON (or {}). Raises on HTTP error."""
          data = json.dumps(payload).encode() if payload is not None else None
          req = urllib.request.Request(
              VIKUNJA_URL + path, data=data, method=method,
              headers={"Authorization": "Bearer " + VIKUNJA_TOKEN, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=25) as resp:
              body = resp.read().decode("utf-8", "replace")
              return json.loads(body) if body.strip() else {}


      # ── Alert -> Holmes ──────────────────────────────────────────────────────────

      def _identity(alert: dict) -> tuple[str, str]:
          labels = alert.get("labels", {}) or {}
          return labels.get("alertname", "?"), labels.get("namespace", "")


      def _scope(alert: dict) -> str:
          """The discriminator that makes a ticket title unique.

          namespace is the right scope for a workload alert and stays stable when a
          pod is replaced. But blackbox/probe alerts carry NO namespace, so scoping on
          it alone collapsed every EndpointDown into one ticket: on 2026-09-22 a single
          "[alert] EndpointDown" stood for both llama.thorix.io and 100.98.214.1, with
          an analysis that discussed only the first, and fixing one could never close
          it. Fall back to the target's own identity so each gets its own ticket.

          Order matters -- namespace first, so a workload alert that also carries an
          instance label is not retitled every time the pod IP changes.
          """
          labels = alert.get("labels", {}) or {}
          for key in ("namespace", "instance", "target", "job"):
              value = labels.get(key)
              if value:
                  return value
          return ""


      def _prompt_for(alert: dict) -> str:
          name, ns = _identity(alert)
          labels = alert.get("labels", {}) or {}
          ann = alert.get("annotations", {}) or {}
          obj = labels.get("pod") or labels.get("deployment") or labels.get("statefulset") or labels.get("instance") or ""
          where = f" in namespace '{ns}'" if ns else ""
          where += f" for '{obj}'" if obj else ""
          summary = ann.get("summary") or ann.get("description") or ""
          return (
              f"A Kubernetes alert '{name}'{where} is firing. Details: {summary}\n"
              f"Alert labels: {json.dumps(labels)}\n"
              "Investigate the root cause using pod status, recent events, logs, and "
              "relevant Prometheus metrics.\n\n"
              "Respond with a SHORT answer (at most ~6 sentences): one line naming the "
              "most likely root cause, a couple of supporting facts, and one concrete "
              "next action. Write plain prose only — do NOT include raw tool output, log "
              "excerpts, counts, timestamps, or section headings. If the available data "
              "is insufficient to determine a cause, say so in one line.\n\n"
              "IMPORTANT: if a tool query returns no results or errors, treat that data "
              "as UNAVAILABLE, not as evidence of absence. Do NOT conclude that a "
              "resource (pod, deployment, etc.) is missing, deleted, or does not exist "
              "unless a successful query explicitly confirms it — otherwise say the data "
              "could not be retrieved."
          )


      def _ask_holmes(alert: dict) -> str:
          prompt = _prompt_for(alert)
          raw = _post_json(HOLMES_URL, {"ask": prompt, "stream": False}, timeout=HOLMES_TIMEOUT)
          analysis = (json.loads(raw).get("analysis") or "").strip()
          if not analysis:  # the local model occasionally returns an empty analysis
              log.info("empty analysis; retrying once")
              raw = _post_json(HOLMES_URL, {"ask": prompt, "stream": False}, timeout=HOLMES_TIMEOUT)
              analysis = (json.loads(raw).get("analysis") or "").strip()
          return analysis or "(Holmes returned no analysis after a retry)"


      # ── Vikunja task lifecycle ───────────────────────────────────────────────────

      def _task_title(alert: dict) -> str:
          name, _ = _identity(alert)
          scope = _scope(alert)
          return f"[alert] {name}" + (f" — {scope}" if scope else "")


      def _ident_key(alert: dict) -> str:
          # Must split exactly the way _task_title does, or resolving one target would
          # arm a pending close against a different target's ticket.
          name, _ = _identity(alert)
          return f"{name}/{_scope(alert)}"


      def _search_tasks(s: str) -> list[dict]:
          """All tasks in the project whose text matches `s`, across every page.

          Raises on any HTTP/JSON error: a half-read list must never look like "no
          such task", or the caller would file a duplicate.
          """
          out: list[dict] = []
          q = urllib.parse.quote(s, safe="")
          for page in range(1, 51):
              batch = _vk("GET", f"/projects/{VIKUNJA_PROJECT_ID}/tasks?s={q}&per_page=50&page={page}")
              if not isinstance(batch, list):
                  raise ValueError("unexpected vikunja list response")
              out.extend(batch)
              if len(batch) < 50:
                  return out
          log.error("vikunja search for %r hit the 50-page cap; results truncated", s)
          return out


      def _pick(tasks: list[dict], title: str) -> tuple[dict | None, dict | None]:
          open_t: dict | None = None
          closed_t: dict | None = None
          for t in tasks or []:
              if t.get("title") != title:
                  continue
              if not t.get("done"):
                  open_t = open_t or t
              elif closed_t is None or (t.get("done_at") or "") > (closed_t.get("done_at") or ""):
                  closed_t = t  # done_at is RFC3339 Z, so string compare orders by time
          return open_t, closed_t


      def _find_tasks(title: str) -> tuple[dict | None, dict | None]:
          """Return (open task, most-recently-closed task) matching this title (exact)."""
          try:
              tasks = _search_tasks(title)
          except Exception as exc:  # noqa: BLE001
              log.error("vikunja list failed: %s", exc)
              return None, None
          return _pick(tasks, title)


      def _within_reopen_window(task: dict) -> bool:
          try:
              dt = datetime.fromisoformat((task.get("done_at") or "").replace("Z", "+00:00"))
          except ValueError:
              return False
          return (datetime.now(timezone.utc) - dt).total_seconds() <= REOPEN_WINDOW_HOURS * 3600


      def _description(alert: dict, analysis: str) -> str:
          name, ns = _identity(alert)
          ann = alert.get("annotations", {}) or {}
          summary = ann.get("summary") or ann.get("description") or ""
          parts = [f"<p><b>Alert:</b> {html.escape(name)}" + (f" in <code>{html.escape(ns)}</code>" if ns else "") + "</p>"]
          if summary:
              parts.append(f"<p><b>Summary:</b> {html.escape(summary)}</p>")
          parts.append("<p><b>HolmesGPT root cause:</b><br>" + html.escape(analysis).replace("\n", "<br>") + "</p>")
          parts.append("<p><i>Auto-filed by holmes-alert-relay; closes when the alert resolves.</i></p>")
          return "".join(parts)


      def _analysis_html(analysis: str) -> str:
          return html.escape(analysis).replace("\n", "<br>")


      def _upsert_task(alert: dict, analysis: str) -> None:
          title = _task_title(alert)
          open_t, closed_t = _find_tasks(title)
          if open_t:
              _vk("PUT", f"/tasks/{open_t['id']}/comments",
                  {"comment": "<p><b>Still firing.</b> Latest HolmesGPT diagnosis:<br>"
                              + _analysis_html(analysis) + "</p>"})
              log.info("commented on task %s (%s)", open_t["id"], title)
              return
          if closed_t and _within_reopen_window(closed_t):
              tid = closed_t["id"]
              _vk("POST", f"/tasks/{tid}", {"id": tid, "done": False})  # reopen
              _vk("PUT", f"/tasks/{tid}/comments",
                  {"comment": "<p><b>Alert refired — reopened.</b> Latest HolmesGPT diagnosis:<br>"
                              + _analysis_html(analysis) + "</p>"})
              log.info("reopened task %s (%s)", tid, title)
              return
          t = _vk("PUT", f"/projects/{VIKUNJA_PROJECT_ID}/tasks",
                  {"title": title, "description": _description(alert, analysis)})
          log.info("created task %s (%s)", (t or {}).get("id"), title)


      # ── Grace-period close (reaper) ──────────────────────────────────────────────

      def _schedule_close(alert: dict, grace_minutes: int = CLOSE_GRACE_MINUTES, kind: str = "holmes") -> bool:
          key, title = _ident_key(alert), _task_title(alert)
          ns = (alert.get("labels", {}) or {}).get("namespace", "")
          with _pending_lock:
              if key in _pending_close:
                  return False  # already armed; grace counts from the first resolve
              _pending_close[key] = (time.time() + grace_minutes * 60, title, kind, ns)
          log.info("scheduled close of '%s' in %dm (alert resolved)", title, grace_minutes)
          return True


      def _cancel_pending_close(alert: dict) -> None:
          key = _ident_key(alert)
          with _pending_lock:
              _wo_close_enqueued.discard(key)
              if _pending_close.pop(key, None):
                  log.info("cancelled pending close of '%s' (still firing)", key)


      def _close_task_by_title(title: str) -> None:
          open_t, _ = _find_tasks(title)
          if not open_t:
              return  # nothing open to close (already closed, or never created)
          try:
              _vk("POST", f"/tasks/{open_t['id']}", {"id": open_t["id"], "done": True})
              log.info("closed task %s (%s) — alert stayed resolved", open_t["id"], title)
          except Exception as exc:  # noqa: BLE001
              log.error("vikunja close failed for %s: %s", title, exc)


      def _reap_once(now: float) -> None:
          due: list[str] = []
          wo_due: list[str] = []
          with _pending_lock:
              for key, (deadline, title, kind, _ns) in list(_pending_close.items()):
                  if now < deadline:
                      continue
                  if kind == "wo":
                      # Stays pending: the work-order worker re-checks it and may hold it.
                      if key not in _wo_close_enqueued:
                          _wo_close_enqueued.add(key)
                          wo_due.append(key)
                  else:
                      _pending_close.pop(key, None)
                      due.append(title)
          for key in wo_due:
              try:
                  _wo_queue.put_nowait(("close", key))
              except queue.Full:
                  with _pending_lock:
                      _wo_close_enqueued.discard(key)
                  log.error("work-order queue full; close of %s retried next sweep", key)
          for title in due:
              try:
                  _close_task_by_title(title)
              except Exception as exc:  # noqa: BLE001 - never let the reaper die
                  log.error("reaper close failed for %s: %s", title, exc)


      def _reaper() -> None:
          while True:
              time.sleep(30)
              try:
                  _reap_once(time.time())
              except Exception as exc:  # noqa: BLE001
                  log.error("reaper sweep failed: %s", exc)


      # ── Worker + queue (firing investigations) ───────────────────────────────────

      def _investigate(alert: dict) -> None:
          name, ns = _identity(alert)
          started = time.time()
          log.info("investigating alert=%s ns=%s", name, ns)
          try:
              analysis = _ask_holmes(alert)
          except Exception as exc:  # noqa: BLE001
              log.error("holmes investigation failed for %s: %s", name, exc)
              analysis = f"(HolmesGPT investigation failed: {exc})"
          try:
              _upsert_task(alert, analysis)
          except Exception as exc:  # noqa: BLE001 - never let Vikunja errors kill the worker
              log.error("vikunja upsert failed for %s: %s", name, exc)
          log.info("done alert=%s in %ss", name, int(time.time() - started))


      def _worker() -> None:
          while True:
              alert = _work.get()
              try:
                  _investigate(alert)
              finally:
                  _work.task_done()


      def _enqueue(alert: dict) -> str:
          fp = _ident_key(alert)  # identity de-dup (fingerprint churns on pod restarts)
          now = time.time()
          with _seen_lock:
              if now - _seen.get(fp, 0) < DEDUP_MINUTES * 60:
                  return "deduped"
              for k in [k for k, v in _seen.items() if now - v > DEDUP_MINUTES * 120]:
                  _seen.pop(k, None)
              _seen[fp] = now
          try:
              _work.put_nowait(alert)
              return "queued"
          except queue.Full:
              with _seen_lock:
                  _seen.pop(fp, None)
              return "queue-full"


      # ── Work orders (no Holmes) ──────────────────────────────────────────────────

      MARKER_RE = re.compile(r"(?:<!-- |<p>)relay:wo h=([0-9a-f]{12})(?: -->|</p>)")


      def _is_work_order(alert: dict) -> bool:
          labels = alert.get("labels", {}) or {}
          return labels.get("investigate") == "false" and bool(labels.get("work_order"))


      def _images(alert: dict) -> list[str]:
          ann = alert.get("annotations", {}) or {}
          return [ln.strip() for ln in (ann.get("images") or "").splitlines() if ln.strip()]


      def _wo_hash(alert: dict) -> str:
          ann = alert.get("annotations", {}) or {}
          raw = (ann.get("summary") or "") + "\n" + (ann.get("images") or "")
          return hashlib.sha256(raw.encode()).hexdigest()[:12]


      def _wo_marker(h: str) -> str:
          if WORK_ORDER_MARKER_STYLE == "visible":
              return f"<p>relay:wo h={h}</p>"
          return f"<!-- relay:wo h={h} -->"


      def _last_marker(description: str, comments: list[dict]) -> str | None:
          found = None
          for c in comments or []:
              m = MARKER_RE.findall((c or {}).get("comment") or "")
              if m:
                  found = m[-1]
          if found:
              return found
          m = MARKER_RE.findall(description or "")
          return m[-1] if m else None


      def _images_html(alert: dict) -> str:
          esc = html.escape
          return "<ul>" + "".join(f"<li><code>{esc(i)}</code></li>" for i in _images(alert)) + "</ul>"


      def _wo_description(alert: dict) -> str:
          esc = html.escape
          name, ns = _identity(alert)
          ann = alert.get("annotations", {}) or {}
          return (
              f"<p><b>Work order:</b> {esc(name)} in <code>{esc(ns)}</code></p>"
              f"<p><b>Summary:</b> {esc(ann.get('summary') or '')}</p>"
              "<p><b>Images:</b></p><ul>"
              + "".join(f"<li><code>{esc(i)}</code></li>" for i in _images(alert))
              + "</ul>"
              f"<p><b>Runbook:</b> {esc(ann.get('runbook') or '')}</p>"
              "<p><i>Auto-filed by holmes-alert-relay; closes when a rescan no longer sees these images.</i></p>"
              + _wo_marker(_wo_hash(alert))
          )


      def _wo_upsert(alert: dict) -> None:
          title = _task_title(alert)
          try:
              open_t, closed_t = _pick(_search_tasks(title), title)
          except Exception as exc:  # noqa: BLE001 - unknown state: do nothing, never duplicate
              log.error("work-order search failed for %s: %s", title, exc)
              return
          h = _wo_hash(alert)
          if open_t:
              tid = open_t["id"]
              comments = _vk("GET", f"/tasks/{tid}/comments")
              if _last_marker(open_t.get("description") or "", comments if isinstance(comments, list) else []) == h:
                  log.info("work order %s unchanged (%s)", tid, title)
                  return
              _vk("PUT", f"/tasks/{tid}/comments",
                  {"comment": "<p><b>Updated.</b></p>" + _images_html(alert) + _wo_marker(h)})
              log.info("commented on work-order task %s (%s)", tid, title)
              return
          if closed_t and _within_reopen_window(closed_t):
              tid = closed_t["id"]
              _vk("POST", f"/tasks/{tid}", {"id": tid, "done": False})  # reopen
              _vk("PUT", f"/tasks/{tid}/comments",
                  {"comment": "<p><b>Alert refired — reopened.</b></p>" + _images_html(alert) + _wo_marker(h)})
              log.info("reopened work-order task %s (%s)", tid, title)
              return
          t = _vk("PUT", f"/projects/{VIKUNJA_PROJECT_ID}/tasks",
                  {"title": title, "description": _wo_description(alert)})
          log.info("created work-order task %s (%s)", (t or {}).get("id"), title)


      def _am_get(path: str) -> list:
          with urllib.request.urlopen(ALERTMANAGER_URL + path, timeout=10) as resp:
              return json.loads(resp.read().decode("utf-8", "replace"))


      def _inventory_hold(namespace: str) -> bool:
          """True while the inventory scan reports itself incomplete for this namespace.

          An incomplete alert with no namespace label is a global hold; `phase` is
          ignored. Any error reaching Alertmanager holds (a close is cheap to delay).
          """
          try:
              alerts = _am_get("/api/v2/alerts?active=true&filter="
                               + urllib.parse.quote(f'alertname="{HOLD_ALERTNAME}"'))
              for a in alerts:
                  ns = (a.get("labels", {}) or {}).get("namespace")
                  if not ns or ns == namespace:
                      return True
              return False
          except Exception as exc:  # noqa: BLE001
              log.error("inventory hold check failed (holding): %s", exc)
              return True


      def _wo_process(item: tuple, now: float | None = None) -> None:
          kind, payload = item
          if kind == "upsert":
              _wo_upsert(payload)
              return
          if kind != "close":
              return
          key = payload
          now = time.time() if now is None else now
          with _pending_lock:
              _wo_close_enqueued.discard(key)
              entry = _pending_close.get(key)
              if not entry or now < entry[0]:
                  return  # cancelled (alert refired) or re-armed since it was queued
              _deadline, title, _kind, ns = entry
          def rearm(why: str) -> None:
              with _pending_lock:
                  _wo_close_enqueued.discard(key)
                  if key in _pending_close:
                      _pending_close[key] = (now + WORK_ORDER_CLOSE_GRACE_MINUTES * 60, title, "wo", ns)
              log.info("close re-armed for '%s' (%s)", title, why)

          if _inventory_hold(ns):
              rearm("held: inventory incomplete or unknown")
              return
          # Search directly (not _find_tasks, which swallows errors): any failure must
          # re-arm the close rather than drop it.
          try:
              open_t, _ = _pick(_search_tasks(title), title)
              if open_t:
                  _vk("POST", f"/tasks/{open_t['id']}", {"id": open_t["id"], "done": True})
                  log.info("closed work-order task %s (%s)", open_t["id"], title)
          except Exception as exc:  # noqa: BLE001
              log.error("work-order close failed for %s: %s", title, exc)
              rearm("close failed")
              return
          with _pending_lock:
              _pending_close.pop(key, None)  # no-op if a firing cancelled it meanwhile
              _wo_close_enqueued.discard(key)


      def _wo_worker() -> None:
          while True:
              item = _wo_queue.get()
              try:
                  _wo_process(item)
              except Exception as exc:  # noqa: BLE001 - never let Vikunja/AM errors kill the worker
                  log.error("work-order step failed: %s", exc)
              finally:
                  _wo_queue.task_done()


      def _reconcile_work_orders() -> int:
          """At startup: arm a close for open work-order tasks with no active alert."""
          try:
              active_alerts = _am_get("/api/v2/alerts?active=true&filter="
                                      + urllib.parse.quote('work_order="cve-upgrade"'))
              active = {_task_title(a) for a in active_alerts}
              open_n = scheduled = 0
              for name in sorted(WORK_ORDER_ALERTNAMES):
                  prefix = f"[alert] {name} — "
                  for t in _search_tasks(f"[alert] {name}"):
                      title = t.get("title") or ""
                      if t.get("done") or not title.startswith(prefix):
                          continue
                      open_n += 1
                      if title in active:
                          continue
                      ns = title[len(prefix):]
                      if _schedule_close({"labels": {"alertname": name, "namespace": ns}},
                                         WORK_ORDER_CLOSE_GRACE_MINUTES, kind="wo"):
                          scheduled += 1
          except Exception as exc:  # noqa: BLE001
              log.error("reconcile skipped: %s", exc)
              return 0
          log.info("reconcile: open=%d active=%d scheduled=%d", open_n, len(active), scheduled)
          return scheduled


      def _handle_alerts(data: dict) -> dict:
          counts = {"queued": 0, "deduped": 0, "queue-full": 0, "resolved": 0, "skipped": 0, "work-order": 0}
          for alert in data.get("alerts", []) or []:
              status = alert.get("status")
              if _is_work_order(alert):
                  if status == "firing":
                      _cancel_pending_close(alert)
                      try:
                          _wo_queue.put_nowait(("upsert", alert))
                          counts["work-order"] += 1
                      except queue.Full:
                          counts["queue-full"] += 1
                  elif status == "resolved":
                      _schedule_close(alert, WORK_ORDER_CLOSE_GRACE_MINUTES, kind="wo")
                      counts["work-order"] += 1
                  else:
                      counts["skipped"] += 1
                  continue
              sev = (alert.get("labels", {}) or {}).get("severity", "").lower()
              if sev not in RELAY_SEVERITIES:
                  counts["skipped"] += 1
                  continue
              if status == "firing":
                  _cancel_pending_close(alert)  # problem is back; don't let it close
                  counts[_enqueue(alert)] += 1
              elif status == "resolved":
                  _schedule_close(alert)        # arm a grace-period close (reaper acts)
                  counts["resolved"] += 1
              else:
                  counts["skipped"] += 1
          return counts


      # ── HTTP server ──────────────────────────────────────────────────────────────

      class Handler(BaseHTTPRequestHandler):
          def log_message(self, *_a):
              return

          def _send(self, code: int, body: str = "") -> None:
              self.send_response(code)
              self.send_header("Content-Type", "text/plain")
              self.end_headers()
              if body:
                  self.wfile.write(body.encode())

          def do_GET(self):
              self._send(200, "ok") if self.path == "/healthz" else self._send(404, "not found")

          def do_POST(self):
              if self.path != "/alert":
                  self._send(404, "not found")
                  return
              try:
                  length = int(self.headers.get("Content-Length", "0"))
                  data = json.loads(self.rfile.read(length) or b"{}")
              except Exception as exc:  # noqa: BLE001
                  self._send(400, f"bad request: {exc}")
                  return
              counts = _handle_alerts(data)
              log.info("webhook: %s (qsize=%d)", counts, _work.qsize())
              self._send(200, json.dumps(counts))


      def main() -> None:
          threading.Thread(target=_worker, daemon=True).start()
          threading.Thread(target=_reaper, daemon=True).start()
          threading.Thread(target=_wo_worker, daemon=True).start()
          threading.Thread(target=_reconcile_work_orders, daemon=True).start()
          log.info(
              "relay up on :%d holmes=%s severities=%s dedup=%dm grace=%dm reopen=%dh vikunja=%s project=%s token=%s",
              PORT, HOLMES_URL, sorted(RELAY_SEVERITIES), DEDUP_MINUTES, CLOSE_GRACE_MINUTES,
              REOPEN_WINDOW_HOURS, VIKUNJA_URL, VIKUNJA_PROJECT_ID, "set" if VIKUNJA_TOKEN else "MISSING",
          )
          ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()


      if __name__ == "__main__":
          main()
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
httproute:
  enabled: false

probes:
  enabled: true
  liveness:
    type: http
    path: /healthz
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    type: http
    path: /healthz
    port: 8080
    initialDelaySeconds: 3
    periodSeconds: 15
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  name: holmes-alert-relay
  automountServiceAccountToken: false

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 128Mi }

networkPolicy:
  enabled: true
  ingress:
    gatewayOnly: false
    # Alertmanager (same namespace) posts webhooks to :8080.
    customRules:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: victoriametrics
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
  egress:
    denyAll: true
    allowDNS: false
    customRules:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # HolmesGPT API (cross-namespace). Cilium enforces egress on the BACKEND
      # pod port (5050), not the Service port (80), so allow 5050 (80 kept too).
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: holmesgpt
        toPorts:
          - ports:
              - port: "80"
                protocol: TCP
              - port: "5050"
                protocol: TCP
      # Vikunja API (cross-namespace). Service port == backend pod port 3456.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: vikunja
        toPorts:
          - ports:
              - port: "3456"
                protocol: TCP
      # Alertmanager API (same namespace): work-order startup reconcile and the
      # close hold. Without it both see "unreachable" and every close is held.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: victoriametrics
              k8s:app.kubernetes.io/component: alertmanager
        toPorts:
          - ports:
              - port: "9093"
                protocol: TCP

apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-backup-verify
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: paperless-backup-verify
spec:
  schedule: {{ .Values.verify.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: paperless-backup-verify
        spec:
          restartPolicy: Never
          containers:
          - name: verify
            image: "{{ .Values.verify.image.repository }}:{{ .Values.verify.image.tag }}"
            imagePullPolicy: {{ .Values.verify.image.pullPolicy }}
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -e
              TODAY=$(date +%Y%m%d)
              BACKUP_DIR="{{ .Values.backup.mountPath }}"
              MIN_SIZE={{ .Values.verify.minSizeBytes }}

              echo "Checking for Paperless backup from today (${TODAY})..."

              BACKUP=$(find "${BACKUP_DIR}" -maxdepth 1 -name "paperless-db-backup-${TODAY}T*.sql.gz" -type f 2>/dev/null | head -1)

              if [ -z "${BACKUP}" ]; then
                echo "ERROR: No backup file found for today (${TODAY})"
                echo "Files in backup directory:"
                ls -lh "${BACKUP_DIR}"/paperless-db-backup-*.sql.gz 2>/dev/null | tail -5 || echo "  (none)"
                exit 1
              fi

              FILE_SIZE=$(stat -c%s "${BACKUP}")
              echo "Found: $(basename ${BACKUP}) (${FILE_SIZE} bytes)"

              if [ "${FILE_SIZE}" -lt "${MIN_SIZE}" ]; then
                echo "ERROR: Backup is too small (${FILE_SIZE} < ${MIN_SIZE} bytes)"
                exit 1
              fi

              echo "OK: Backup verified (${FILE_SIZE} bytes, minimum ${MIN_SIZE})"
            resources:
              {{- toYaml .Values.verify.resources | nindent 14 }}
            volumeMounts:
            - name: backup
              mountPath: {{ .Values.backup.mountPath }}
              subPath: {{ .Values.backup.subPath }}
              readOnly: true
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: paperless-db-backup-smb

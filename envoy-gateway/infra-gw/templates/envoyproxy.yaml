apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: infra-gw-proxy
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        # Cluster: required for L2-announced LoadBalancer IPs.
        externalTrafficPolicy: Cluster
        annotations:
          lbipam.cilium.io/ips: {{ required "loadBalancerIP is required" .Values.loadBalancerIP | quote }}
  telemetry:
    accessLog:
      settings:
      - format:
          type: Text
          # Folded with clip chomping (">"), so the format ends in a newline.
          # Envoy writes a custom text format as given; without the newline
          # entries run together on one line.
          text: >
            [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%"
            %RESPONSE_CODE% %RESPONSE_FLAGS% tls_fail="%DOWNSTREAM_TRANSPORT_FAILURE_REASON%"
            peer_uri_san="%DOWNSTREAM_PEER_URI_SAN%" upstream=%UPSTREAM_HOST%
        sinks:
        - type: File
          file:
            path: /dev/stdout
      # Listener-level log for downstream TLS handshake failures (a rejected
      # client certificate never reaches a route, so the setting above never
      # sees it). A typed setting is applied as-is: no implicit NR filter.
      # The CEL attribute is absent unless the downstream transport failed,
      # and a missing attribute evaluates to false, so only failures log.
      # FILTER_CHAIN_NAME is the Gateway listener name (<ns>/<gateway>/<listener>).
      - type: Listener
        matches:
        - 'connection.transport_failure_reason != ""'
        format:
          type: Text
          # Folded with clip chomping (">"), so the format ends in a newline.
          text: >
            [%START_TIME%] listener=%FILTER_CHAIN_NAME% local=%DOWNSTREAM_LOCAL_ADDRESS%
            sni=%REQUESTED_SERVER_NAME% tls_fail="%DOWNSTREAM_TRANSPORT_FAILURE_REASON%"
            peer_uri_san="%DOWNSTREAM_PEER_URI_SAN%"
        sinks:
        - type: File
          file:
            path: /dev/stdout

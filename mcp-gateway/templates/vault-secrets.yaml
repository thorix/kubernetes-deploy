{{- if .Values.vault.enabled }}
---
# Gateway secrets (admin creds, JWT key, basic auth)
# Destination name matches what mcp-stack deployment expects via envFrom secretRef
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-gateway-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ include "mcp-gateway.fullname" . }}-auth
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ index .Values.vault.secrets "gateway-secrets" }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ include "mcp-gateway.fullname" . }}-gateway-secret
    create: true
---
# Database credentials (postgres user/password/db)
# Referenced via postgres.existingSecret in mcp-stack values
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-database
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ include "mcp-gateway.fullname" . }}-auth
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.secrets.database }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ include "mcp-gateway.fullname" . }}-database
    create: true
{{- end }}

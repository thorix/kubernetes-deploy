{{- if .Values.mcpServers }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-register-servers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
  annotations:
    # ArgoCD sync hook - run after all other resources are synced
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # NOTE: ArgoCD excludes hook resources (this Job) from its diff/drift
    # detection entirely, so annotations here (e.g. a checksum) can never
    # trigger a sync on their own. The registration script instead lives in
    # register-servers-configmap.yaml, a normal tracked resource that ArgoCD
    # DOES diff — changing mcpServers/virtualServers changes that ConfigMap,
    # which produces real drift, which triggers a sync, which re-runs this
    # PostSync hook. Do not move the script back inline here.
spec:
  backoffLimit: 3
  # Up to ~150s waiting for the gateway to become ready, plus up to ~70s of
  # mandatory tool-discovery polling (10s initial + up to 60s of 5s retries)
  # before the hard-fail check runs. A SIGTERM mid-script (from the deadline
  # hitting) is worse than a clean exit 1: for the delete+recreate gateway
  # path it could fire between the DELETE and the recreate POST, leaving a
  # gateway deleted with no self-verification step ever running. Sized with
  # generous headroom above the ~220s worst case rather than cutting it close.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "mcp-gateway.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: register-script
          configMap:
            name: {{ include "mcp-gateway.fullname" . }}-register-script
            defaultMode: 0755
      containers:
        - name: register-servers
          # alpine (not curlimages/curl) because register.sh needs jq for
          # robust JSON parsing of the gateway API responses; curl and jq
          # are installed at container start (`apk add --no-cache curl jq`,
          # first line of register.sh) - matches this repo's existing
          # convention for other MCP deployments.
          image: alpine:3.20
          env:
            - name: PLATFORM_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-gateway-secret
                  key: PLATFORM_ADMIN_EMAIL
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-gateway-secret
                  key: PLATFORM_ADMIN_PASSWORD
          command:
            - /bin/sh
            - /scripts/register.sh
          volumeMounts:
            - name: register-script
              mountPath: /scripts
{{- end }}

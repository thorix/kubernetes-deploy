{{- if .Values.vaultOperator.enabled }}
# Vault CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaults.vault.banzaicloud.com
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    controller-gen.kubebuilder.io/version: v0.11.3
  labels:
    app.kubernetes.io/name: vault-operator
    app.kubernetes.io/version: {{ .Values.vaultOperator.version | quote }}
spec:
  group: vault.banzaicloud.com
  names:
    kind: Vault
    listKind: VaultList
    plural: vaults
    singular: vault
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: Vault is the Schema for the vaults API
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: VaultSpec defines the desired state of Vault
            type: object
            properties:
              size:
                type: integer
                minimum: 1
              image:
                type: string
              externalConfig:
                type: object
                properties:
                  address:
                    type: string
                  auth:
                    type: object
                    properties:
                      type:
                        type: string
                      token:
                        type: object
                        properties:
                          secretName:
                            type: string
                          key:
                            type: string
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
# VaultPolicy CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultpolicies.vault.banzaicloud.com
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    controller-gen.kubebuilder.io/version: v0.11.3
  labels:
    app.kubernetes.io/name: vault-operator
    app.kubernetes.io/version: {{ .Values.vaultOperator.version | quote }}
spec:
  group: vault.banzaicloud.com
  names:
    kind: VaultPolicy
    listKind: VaultPolicyList
    plural: vaultpolicies
    singular: vaultpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: VaultPolicy is the Schema for the vaultpolicies API
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: VaultPolicySpec defines the desired state of VaultPolicy
            type: object
            properties:
              vaultRef:
                description: Reference to Vault CR
                type: string
              policy:
                description: HCL or JSON policy content
                type: string
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
# VaultAuthRole CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultauthroles.vault.banzaicloud.com
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    controller-gen.kubebuilder.io/version: v0.11.3
  labels:
    app.kubernetes.io/name: vault-operator
    app.kubernetes.io/version: {{ .Values.vaultOperator.version | quote }}
spec:
  group: vault.banzaicloud.com
  names:
    kind: VaultAuthRole
    listKind: VaultAuthRoleList
    plural: vaultauthroles
    singular: vaultauthrole
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: VaultAuthRole is the Schema for the vaultauthroles API
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: VaultAuthRoleSpec defines the desired state of VaultAuthRole
            type: object
            properties:
              vaultRef:
                description: Reference to Vault CR
                type: string
              authPath:
                description: Auth backend path
                type: string
              name:
                description: Role name in Vault
                type: string
              bound_service_account_names:
                description: ServiceAccount names that can use this role
                type: array
                items:
                  type: string
              bound_service_account_namespaces:
                description: Namespaces of ServiceAccounts that can use this role
                type: array
                items:
                  type: string
              policies:
                description: Vault policies attached to this role
                type: array
                items:
                  type: string
              audience:
                description: JWT audience
                type: string
              ttl:
                description: Token TTL
                type: string
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
{{- end }}

{{- if and .Values.vault.enabled .Values.vault.secrets }}
{{- range $key, $path := .Values.vault.secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "simple-service.fullname" $ }}-{{ $key }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "simple-service.labels" $ | nindent 4 }}
spec:
  vaultAuthRef: {{ include "simple-service.fullname" $ }}-auth
  mount: {{ $.Values.vault.mount }}
  type: kv-v2
  path: {{ $path }}
  refreshAfter: {{ $.Values.vault.refreshAfter }}
  destination:
    name: {{ include "simple-service.fullname" $ }}-{{ $key }}
    create: true
{{- end }}
{{- end }}

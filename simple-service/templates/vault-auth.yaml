{{- if .Values.vault.enabled }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ include "simple-service.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "simple-service.labels" . | nindent 4 }}
spec:
  vaultConnectionRef: {{ include "simple-service.fullname" . }}-connection
  method: kubernetes
  mount: {{ .Values.vault.kubernetes.mountPath }}
  kubernetes:
    role: {{ .Values.vault.kubernetes.role | default .Release.Name }}
    serviceAccount: {{ .Values.vault.kubernetes.serviceAccount | default (include "simple-service.serviceAccountName" .) }}
    audiences:
      - {{ .Values.vault.kubernetes.audience }}
{{- end }}

# Grafana MCP Server - observability queries via MCP
# Uses supergateway to bridge stdio MCP server to Streamable HTTP transport

image:
  repository: node
  tag: "24-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

# Container port (supergateway Streamable HTTP)
containerPort: 3000

# Download mcp-grafana Go binary and bridge with supergateway
command:
- /bin/sh
- -c
- |
  set -e
  # Install supergateway
  npm install -g supergateway@3.4.3

  # Download mcp-grafana binary
  # Asset filenames use x86_64 / arm64 (not amd64). See github.com/grafana/mcp-grafana/releases.
  ARCH=$(uname -m | sed 's/aarch64/arm64/')
  VERSION="v0.12.0"
  wget -q "https://github.com/grafana/mcp-grafana/releases/download/${VERSION}/mcp-grafana_Linux_${ARCH}.tar.gz" -O /tmp/mcp-grafana.tar.gz
  tar -xzf /tmp/mcp-grafana.tar.gz -C /usr/local/bin mcp-grafana
  chmod +x /usr/local/bin/mcp-grafana
  rm /tmp/mcp-grafana.tar.gz

  exec supergateway \
    --stdio "mcp-grafana" \
    --outputTransport streamableHttp \
    --port 3000 \
    --healthEndpoint /healthz

# Environment variables
env:
- name: GRAFANA_URL
  value: "http://grafana.victoriametrics.svc.cluster.local:80"
- name: GRAFANA_SERVICE_ACCOUNT_TOKEN
  valueFrom:
    secretKeyRef:
      name: grafana-mcp-simple-service-token
      key: GRAFANA_SERVICE_ACCOUNT_TOKEN

# HTTP probes via supergateway health endpoint
probes:
  enabled: true
  liveness:
    type: http
    path: /healthz
    port: 3000
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    type: http
    path: /healthz
    port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Service account
serviceAccount:
  create: true
  name: "grafana-mcp"

# Vault integration for Grafana service account token
vault:
  enabled: true
  address: "http://vault.vault.svc.cluster.local:8200"
  skipTLSVerify: true
  mount: kv
  kubernetes:
    mountPath: kubernetes
    role: grafana-mcp
    serviceAccount: grafana-mcp
    audience: vault
    tokenTTL: 86400
  secrets:
    token: grafana-mcp/token

# Resource limits
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

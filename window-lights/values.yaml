# window-lights service — public base (generic + location-clean).
# Polls the window-lights git repo with a read-only deploy key and writes WLED
# presets (every look + a daily "Tonight") to one controller. The private rye
# overlay (kubernetes-config/rye/window-lights) adds the repo URL, the
# controller address, and the egress rules that name them.
workloadType: Deployment
replicaCount: 1
strategy:
  type: Recreate   # single writer to the controller

image:
  repository: harbor.lan/library/window-lights
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

# ENTRYPOINT is `wl serve` (binds 0.0.0.0:8080). State is rebuilt from git on start.
env:
  - name: PORT
    value: "8080"
  - name: POLL_SECONDS
    value: "60"
  - name: DEPLOY_KEY
    valueFrom: { secretKeyRef: { name: window-lights-simple-service-deploy-key, key: DEPLOY_KEY } }

service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080
httproute:
  enabled: false

probes:
  enabled: true
  liveness:
    type: http
    path: /healthz
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    type: http
    path: /healthz
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 15
    failureThreshold: 3

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  name: window-lights
  automountServiceAccountToken: false   # no k8s API access

resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 128Mi }

# Vault: sync kv/window-lights/deploy-key -> Secret window-lights-simple-service-deploy-key.
vault:
  enabled: true
  kubernetes:
    role: window-lights
    serviceAccount: window-lights
  secrets:
    deploy-key: window-lights/deploy-key

networkPolicy:
  enabled: true
  ingress:
    gatewayOnly: false
    # Same-namespace only; /status is read via kubectl port-forward.
    customRules:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: window-lights
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
  egress:
    denyAll: true
    allowDNS: false   # L7 DNS supplied below (required for toFQDNs)
    customRules:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # git over SSH; the controller rule is added in the private overlay.
      - toFQDNs:
          - matchName: github.com
        toPorts:
          - ports:
              - port: "22"
                protocol: TCP

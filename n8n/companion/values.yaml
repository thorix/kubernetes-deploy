# Vault integration for n8n secrets
# Creates K8s secrets from Vault for n8n and PostgreSQL to reference
vault:
  enabled: true
  address: "http://vault.vault.svc.cluster.local:8200"
  skipTLSVerify: true
  mount: kv
  refreshAfter: 1h
  kubernetes:
    mountPath: kubernetes
    role: n8n
    serviceAccount: n8n-vault
    audience: vault
    tokenTTL: 86400
  secrets:
    config: n8n/config

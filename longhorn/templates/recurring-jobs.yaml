apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
  labels:
    {{- include "longhorn.labels" . | nindent 4 }}
spec:
  cron: "0 10 * * *"
  task: backup
  retain: 7
  concurrency: 2
  groups:
  - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
  labels:
    {{- include "longhorn.labels" . | nindent 4 }}
spec:
  cron: "0 9 * * *"
  task: snapshot
  retain: 3
  concurrency: 2
  groups:
  - default

# Hello World - values for simple-service chart

# Nginx image
image:
  repository: nginx
  tag: "1.31-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

# nginx listens on port 80
containerPort: 80

# Service configuration
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 80

# HTTPRoute - disabled by default, enabled in values.prod.yaml
httproute:
  enabled: false
  hostname: ""
  gateway:
    name: https-gateway
    namespace: kube-system

# ServiceAccount
serviceAccount:
  create: true

# ConfigMap for HTML content (loaded via fileParameters)
configMap:
  enabled: true
  mountPath: /usr/share/nginx/html
  files: {}

# Resources
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Probes
probes:
  enabled: true
  liveness:
    path: /
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /
    port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

networkPolicy:
  enabled: true
  egress:
    denyAll: true
    allowDNS: false
  ingress:
    gatewayOnly: true

name: Secret & hygiene scan

# Blocks secrets AND environment-specific values from reaching main.
# To ENFORCE: make BOTH "gitleaks" and "hygiene-lint" required status checks in
#   branch protection for main
#   (Settings -> Branches -> Branch protection rules -> Require status checks).
on:
  pull_request:
  push:
    # renovate/** is included so these four checks — which are the required
    # status checks on main — also run on Renovate's branches. Renovate's
    # branch-mode automerge waits for checks on the branch itself and never
    # opens a PR, so without this the branch has no checks, automerge stalls,
    # and it falls back to raising a PR after 24h.
    branches: [main, 'renovate/**']

permissions:
  contents: read
  pull-requests: read   # gitleaks PR-mode enumerates the PR's commits via the API

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan the pushed/PR commit range
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required for PR-mode scanning (the action calls the GitHub API to
          # enumerate the PR's commits). Push-mode doesn't need it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE only needed for GitHub Organizations (free for personal repos)

  trufflehog:
    # Layer 1b — second secret scanner (complementary detectors + verification).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@3cbcd39c7e3ceda2ec5df828ebb9338b0605076b  # main 2026-07-14
        with:
          extra_args: --results=verified,unknown

  hygiene-lint:
    # Layer A — no real domains / private IPs / location tells in this public repo.
    # (Layer B, the authoritative exact-match scan for real values, runs from the
    #  private kubernetes-config repo where it can safely know them.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: hygiene-lint
        run: python3 scripts/hygiene_lint.py --all

  commit-tz:
    # Guard — every new commit must be UTC (+0000); the offset leaks region.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          # On PRs, check out the real head commit — NOT the synthetic
          # refs/pull/N/merge commit GitHub generates (its offset is outside our
          # control and it never lands on main). Empty on push events → default.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: commit timestamps must be UTC
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            # A push that CREATES a branch reports before=000...0, which is not a
            # real object. Falling back to the repo's root commit would scan the
            # ENTIRE history and fail on legacy commits that predate this policy.
            # The commits a push actually adds are the ones after the fork point,
            # so prefer the merge-base with the default branch.
            def="${{ github.event.repository.default_branch }}"
            git fetch -q --no-tags origin "+refs/heads/${def}:refs/remotes/origin/${def}" 2>/dev/null || true
            base="$(git merge-base "origin/${def}" HEAD 2>/dev/null \
                    || git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          scripts/check_commit_tz.sh "${base}..HEAD"

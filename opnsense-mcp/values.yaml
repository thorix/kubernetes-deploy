# OPNsense MCP Server - read-only firewall diagnostics
# Uses supergateway to bridge stdio MCP server to Streamable HTTP transport

image:
  repository: node
  tag: "24-alpine"
  pullPolicy: IfNotPresent

replicaCount: 1

# Container port (supergateway SSE)
containerPort: 3000

# Install opnsense-mcp-server and supergateway, then run via SSE bridge
command:
- /bin/sh
- -c
- |
  npm install -g @richard-stovall/opnsense-mcp-server@0.5.3 supergateway@3.4.3
  exec supergateway \
    --stdio "opnsense-mcp-server" \
    --outputTransport streamableHttp \
    --port 3000 \
    --healthEndpoint /healthz

# Environment variables
# NOTE: OPNSENSE_URL is the firewall address — environment-specific. The real value
# lives in the private config overlay (rye/opnsense-mcp/values.yaml); the .lan
# placeholder keeps this base renderable without exposing a real network address.
env:
- name: OPNSENSE_URL
  value: "https://opnsense.lan"
- name: OPNSENSE_VERIFY_SSL
  value: "false"
- name: INCLUDE_PLUGINS
  value: "false"
- name: OPNSENSE_API_KEY
  valueFrom:
    secretKeyRef:
      name: opnsense-mcp-simple-service-api
      key: OPNSENSE_API_KEY
- name: OPNSENSE_API_SECRET
  valueFrom:
    secretKeyRef:
      name: opnsense-mcp-simple-service-api
      key: OPNSENSE_API_SECRET

# HTTP probes via supergateway health endpoint
probes:
  enabled: true
  liveness:
    type: http
    path: /healthz
    port: 3000
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    type: http
    path: /healthz
    port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

# Service configuration
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Service account
serviceAccount:
  create: true
  name: "opnsense-mcp"

# Vault integration for OPNsense API credentials
vault:
  enabled: true
  address: "http://vault.vault.svc.cluster.local:8200"
  skipTLSVerify: true
  mount: kv
  kubernetes:
    mountPath: kubernetes
    role: opnsense-mcp
    serviceAccount: opnsense-mcp
    audience: vault
    tokenTTL: 86400
  secrets:
    api: opnsense-mcp/api

# Resource limits
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

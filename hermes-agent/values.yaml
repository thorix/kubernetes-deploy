# Hermes Agent — phase-0 locked-down deploy.
# Spec: kubernetes-deploy-docs/docs/superpowers/specs/2026-08-23-hermes-agent-deploy-design.md
workloadType: StatefulSet
replicaCount: 1

image:
  repository: nousresearch/hermes-agent
  # v2026.8.19 linux/amd64 — digest is authoritative; tag kept for readability.
  tag: "v2026.9.24@sha256:2fd023efbb8d3d2b0ce1a73d028b07370cff34f567cfe0e999553e8c327ea283"
  pullPolicy: IfNotPresent

# ENTRYPOINT is /init (s6 supervisor: starts root, drops to HERMES_UID/GID).
# Pass the subcommand as ARGS so /init is preserved (command: would break it).
args: ["gateway", "run"]

env:
  - name: HERMES_UID
    value: "10000"
  - name: HERMES_GID
    value: "10000"
  # Model provider: Hermes's `openrouter` provider (generic OpenAI-compatible
  # client), pointed at the in-cluster LiteLLM gateway with Hermes's own
  # LiteLLM virtual key. LiteLLM routes the alias to Nous Portal.
  - name: OPENROUTER_API_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-agent-simple-service-credentials
        key: LITELLM_API_KEY
  - name: OPENROUTER_BASE_URL
    value: "http://litellm.litellm.svc.cluster.local:4000/v1"
  - name: OPENROUTER_MODEL
    value: "claude-sonnet-5.5"
  # OpenAI-compatible API server: the front door for the Pebble ring bridge
  # (and later other clients). In-cluster only; bearer API_SERVER_KEY.
  - name: API_SERVER_ENABLED
    value: "true"
  - name: API_SERVER_HOST
    value: "0.0.0.0"
  - name: API_SERVER_PORT
    value: "8642"
  - name: API_SERVER_KEY
    valueFrom:
      secretKeyRef:
        name: hermes-agent-simple-service-credentials
        key: API_SERVER_KEY

# Phase 1: the API server is reachable in-cluster only (see networkPolicy).
containerPort: 8642
service:
  enabled: true
  port: 8642
httproute:
  enabled: false
probes:
  enabled: false   # no health path wired yet; add once gateway/dashboard health confirmed

# Persistent SQLite/agent data, shared by both containers in the pod.
volumeClaimTemplates:
  - name: data
    mountPath: /opt/data
    storageClassName: longhorn
    accessModes: ["ReadWriteOnce"]
    size: 10Gi

podSecurityContext:
  fsGroup: 10000   # so the dropped-privilege user (10000) can write /opt/data

# Main (gateway) container hardening. drop ALL, then add back the minimal caps
# the s6 init needs to set up dirs and drop root->10000. TIGHTEN in Task 3:
# if the pod starts clean, remove caps one at a time and re-test.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE", "FOWNER"]

serviceAccount:
  name: hermes-agent
  automountServiceAccountToken: false   # no K8s API access (also the chart default)

# Hermes reads its model from /opt/data/config.yaml (persisted; env vars like
# OPENROUTER_BASE_URL/MODEL do not override it). Pin the `model:` block to
# LiteLLM from git on every start; other settings stay editable in Hermes.
initContainers:
  - name: pin-model-config
    image: "nousresearch/hermes-agent:v2026.9.24@sha256:2fd023efbb8d3d2b0ce1a73d028b07370cff34f567cfe0e999553e8c327ea283"
    imagePullPolicy: IfNotPresent
    command: ["/opt/hermes/.venv/bin/python", "-c"]
    args:
      - |
        import os, yaml
        p = "/opt/data/config.yaml"
        if not os.path.exists(p):
            print("no config.yaml yet; Hermes will create it - nothing to pin"); raise SystemExit
        import json
        d = yaml.safe_load(open(p)) or {}
        want = {"provider": os.environ["MODEL_PROVIDER"],
                "base_url": os.environ["MODEL_BASE_URL"],
                "default": os.environ["MODEL_DEFAULT"]}
        api_tools = json.loads(os.environ["API_SERVER_TOOLSETS"])
        changed = False
        if d.get("model") != want:
            d["model"] = want; changed = True
        pt = d.setdefault("platform_toolsets", {})
        if pt.get("api_server") != api_tools:
            pt["api_server"] = api_tools; changed = True
        if changed:
            yaml.safe_dump(d, open(p, "w"), sort_keys=False)
        print("model:", d["model"], "| api_server toolsets:", pt["api_server"], "| changed:", changed)
    env:
      - name: MODEL_PROVIDER
        value: "openrouter"   # generic OpenAI-compatible client; key = OPENROUTER_API_KEY
      - name: MODEL_BASE_URL
        value: "http://litellm.litellm.svc.cluster.local:4000/v1"
      - name: MODEL_DEFAULT
        value: "claude-sonnet-5.5"
      # Tools the API server channel (the Pebble ring bridge) may use. The
      # default hermes-api-server set includes terminal/file-write/process
      # tools, which must never be reachable from the ring. cronjob and
      # delegation are left out too: scheduled jobs and subagents run with
      # fuller toolsets, a back door to the terminal.
      - name: API_SERVER_TOOLSETS
        value: '["memory", "todo", "session_search", "clarify"]'
    volumeMounts:
      - name: data
        mountPath: /opt/data
    securityContext:
      runAsUser: 10000
      runAsGroup: 10000
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

# Dashboard as a second container in the same pod (shares localhost + /opt/data).
extraContainers:
  - name: dashboard
    image: "nousresearch/hermes-agent:v2026.9.24@sha256:2fd023efbb8d3d2b0ce1a73d028b07370cff34f567cfe0e999553e8c327ea283"
    imagePullPolicy: IfNotPresent
    args: ["dashboard", "--host", "127.0.0.1", "--no-open"]
    env:
      - name: HERMES_UID
        value: "10000"
      - name: HERMES_GID
        value: "10000"
      # Same key as the gateway. Without it this container's stage2 hook
      # generates its own API_SERVER_KEY into the shared /opt/data/.env, which
      # Hermes loads with override=True, so the gateway 401s every client.
      - name: API_SERVER_KEY
        valueFrom:
          secretKeyRef:
            name: hermes-agent-simple-service-credentials
            key: API_SERVER_KEY
    volumeMounts:
      - name: data
        mountPath: /opt/data
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
        add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE", "FOWNER"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

# Vault: sync NOUS_API_KEY from kv-v2 hermes-agent/credentials -> K8s Secret.
vault:
  enabled: true
  kubernetes:
    role: hermes-agent
    serviceAccount: hermes-agent
  secrets:
    credentials: hermes-agent/credentials

# --- The security box ---
networkPolicy:
  enabled: true
  ingress:
    gatewayOnly: false
    # Only the Pebble ring bridge may call the API server.
    customRules:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: pebble-bridge
        toPorts:
          - ports:
              - port: "8642"
                protocol: TCP
  egress:
    denyAll: true
    allowDNS: false   # we supply L7 DNS below (required for toFQDNs resolution)
    customRules:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
            rules:
              dns:
                - matchPattern: "*"
      # Models only, via the in-cluster LiteLLM gateway.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: litellm
              app.kubernetes.io/name: litellm
        toPorts:
          - ports:
              - port: "4000"
                protocol: TCP

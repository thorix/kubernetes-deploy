# Frigate NVR - real-time AI object detection for IP cameras
# Uses simple-service chart directly

fullnameOverride: frigate

# Pinned to an explicit version rather than the moving "stable" tag, which
# advances across minor releases without warning.
image:
  repository: ghcr.io/blakeblackshear/frigate
  tag: "0.17.2"
  pullPolicy: IfNotPresent

replicaCount: 1

podAnnotations:
  configmap-hash: "20260823-frigate-0.17-tiered-record"

# Use Recreate strategy - only one instance should access recordings PVC
strategy:
  type: Recreate

# Frigate web UI port (8971 = authenticated HTTPS, 5000 = internal HTTP)
containerPort: 8971

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 5000

# HTTPRoute - disabled by default, enabled in values.prod.yaml
httproute:
  enabled: false
  hostname: ""
  gateway:
    name: https-gateway
    namespace: kube-system

serviceAccount:
  create: true

# Node pinning (GPU node for VAAPI hardware decode) is environment-specific and
# lives in the private overlay (rye/frigate/values.yaml) — omitted from the base.

# Frigate takes time to start - increase initial delay
probes:
  enabled: true
  liveness:
    path: /api/version
    port: 5000
    initialDelaySeconds: 60
    periodSeconds: 10
    # Tolerate transient API backend stalls (under load/reclaim) so kubelet
    # doesn't SIGKILL a healthy container. ~90s of grace before restart.
    timeoutSeconds: 10
    failureThreshold: 6
  readiness:
    path: /api/version
    port: 5000
    initialDelaySeconds: 60
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Frigate is resource-heavy with video processing. The cgroup was pegged at
# the old 4Gi limit (memory.peak=4Gi, 24k+ reclaim events) — mostly reclaimable
# page cache from recording I/O — starving the API and triggering liveness
# SIGKILLs. Node has 128Gi; give it headroom.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 8Gi

# /config must PERSIST, not just be writable.
#
# Frigate keeps its recordings database at /config/frigate.db, and its retention
# cleanup only deletes segments it has rows for. When /config was an emptyDir,
# every pod restart wiped that database, so all recordings made before the
# restart became orphans Frigate would never delete again -- retention silently
# stopped applying to them while continuing to work for anything newer.
#
# The symptom is quiet: retention keeps working for anything recorded since
# the last restart, while everything older is abandoned in place. It surfaces
# as intact day-directories well past the policy window, mixed with small
# remnants from cleanups that died part-way through.
#
# A PVC rather than a hostPath because the database is SQLite: it must not live
# on the SMB recordings share, where CIFS locking would corrupt it.
#
# The initContainer still copies config.yml from the ConfigMap into /config on
# every start, so the rendered config stays authoritative and the PVC only
# carries state Frigate owns (database, model cache).
persistence:
  enabled: true
  mountPath: /config
  size: 5Gi
  storageClass: longhorn
  accessModes:
    - ReadWriteOnce

# ConfigMap for frigate config.yml (injected via fileParameters in deploy.yaml)
# Mounted to /config-ro (read-only) and copied into /config by the initContainer
configMap:
  enabled: true
  mountPath: /config-ro
  files: {}

initContainers:
- name: copy-config
  image: busybox:1.37
  command: ['sh', '-c', 'cp /config-ro/config.yml /config/config.yml']
  volumeMounts:
  - name: config
    mountPath: /config-ro
    readOnly: true
  - name: data
    mountPath: /config

# Environment variables
env:
- name: TZ
  value: "UTC"

# Inject RTSP credentials from Vault-synced secret
envFrom:
- secretRef:
    name: frigate-rtsp
- secretRef:
    name: frigate-doorbell

# Privileged security context needed for GPU device access
securityContext:
  privileged: true

# Recordings storage on SMB NAS
persistentVolumes:
- name: recordings
  capacity: 1Ti
  accessModes:
    - ReadWriteMany
  mountOptions:
    - dir_mode=0777
    - file_mode=0666
    - uid=0
    - gid=0
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeAttributes:
      source: "//nas.lan/frigate"
    nodeStageSecretRef:
      name: frigate-smb

# Additional volumes
volumes:
- name: cache
  emptyDir:
    medium: Memory
- name: shm
  emptyDir:
    medium: Memory
    sizeLimit: 256Mi
- name: dri
  hostPath:
    path: /dev/dri
    type: Directory

# Additional volume mounts
volumeMounts:
- name: recordings
  mountPath: /media/frigate
- name: cache
  mountPath: /tmp/cache
- name: shm
  mountPath: /dev/shm
- name: dri
  mountPath: /dev/dri

# Vault integration for RTSP camera credentials
vault:
  enabled: true
  secrets:
    rtsp: "frigate/rtsp"
    doorbell: "frigate/doorbell"
    smb: "frigate/smb"

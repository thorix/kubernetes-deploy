{{- if .Values.namespaces.enabled }}
{{- range .Values.namespaces.configs }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  {{- if .labels }}
  labels:
    {{- toYaml .labels | nindent 4 }}
  {{- end }}
  {{- if .annotations }}
  annotations:
    {{- toYaml .annotations | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}

{{- if not (index .Values "vault-config-operator" "enableCertManager") }}
# Generate self-signed webhook certificates and patch webhook configs when cert-manager is not enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-cert-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-cert-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-cert-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webhook-cert-gen
subjects:
  - kind: ServiceAccount
    name: webhook-cert-gen
    namespace: {{ .Release.Namespace }}
---
# ClusterRole to patch webhook configurations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-webhook-cert-gen
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-webhook-cert-gen
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-webhook-cert-gen
subjects:
  - kind: ServiceAccount
    name: webhook-cert-gen
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: webhook-cert-gen
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "0"
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: webhook-cert-gen
      restartPolicy: OnFailure
      containers:
        - name: create-cert
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              cd /tmp

              NS={{ .Release.Namespace }}
              MWC=vault-config-operator-mutating-webhook-configuration
              VWC=vault-config-operator-validating-webhook-configuration

              # Patch every webhook entry, then PROVE it.
              #
              # Patching a guessed index range and breaking on the first failure
              # leaves every later entry untouched, and an unconditional success
              # message makes that indistinguishable from a complete run. The
              # count comes from the live object instead, no patch aborts the
              # loop, and the result is verified before claiming success.
              #
              # This matters because these webhooks carry failurePolicy: Fail:
              # an entry with no caBundle rejects every write to the resources
              # it guards, and the failure surfaces far from its cause.
              patch_all() {
                CA="$1"; rc=0
                for KIND_NAME in "mutatingwebhookconfiguration $MWC" \
                                 "validatingwebhookconfiguration $VWC"; do
                  set -- $KIND_NAME; KIND=$1; NAME=$2
                  COUNT=$(kubectl get "$KIND" "$NAME" \
                    -o jsonpath='{range .webhooks[*]}{.name}{"\n"}{end}' 2>/dev/null | grep -c . || true)
                  if [ "${COUNT:-0}" -eq 0 ]; then
                    echo "ERROR: $KIND/$NAME has no webhooks or is missing"; rc=1; continue
                  fi
                  echo "Patching $COUNT webhook(s) in $KIND/$NAME"
                  i=0
                  while [ "$i" -lt "$COUNT" ]; do
                    if ! kubectl patch "$KIND" "$NAME" --type=json \
                         -p="[{\"op\":\"add\",\"path\":\"/webhooks/${i}/clientConfig/caBundle\",\"value\":\"${CA}\"}]" \
                         >/dev/null; then
                      echo "  patch FAILED: $KIND/$NAME webhooks[$i]"; rc=1
                    fi
                    i=$((i + 1))
                  done
                  # Verify rather than assume: list any entry still missing a CA.
                  EMPTY=$(kubectl get "$KIND" "$NAME" \
                    -o jsonpath='{range .webhooks[*]}{.name}={.clientConfig.caBundle}{"\n"}{end}' \
                    2>/dev/null | grep '=$' || true)
                  if [ -n "$EMPTY" ]; then
                    echo "ERROR: $KIND/$NAME still has entries with no caBundle:"
                    echo "$EMPTY" | sed 's/=$//; s/^/    /'
                    rc=1
                  fi
                done
                return $rc
              }

              # Reuse an existing cert when there is one; only mint a new CA if
              # the secret is absent or unusable, so the CA stays stable.
              if kubectl get secret webhook-server-cert -n "$NS" -o jsonpath='{.data.tls\.crt}' 2>/dev/null \
                   | base64 -d | openssl x509 -noout 2>/dev/null; then
                CA_BUNDLE=$(kubectl get secret webhook-server-cert -n "$NS" -o jsonpath='{.data.ca\.crt}' 2>/dev/null || echo "")
                if [ -n "$CA_BUNDLE" ]; then
                  echo "Reusing existing webhook-server-cert"
                  patch_all "$CA_BUNDLE"
                  echo "Webhook CA bundles verified present on every entry"
                  exit 0
                fi
                echo "Secret exists but carries no ca.crt - regenerating"
              fi

              echo "Generating new certificates..."

              # Generate CA
              openssl genrsa -out ca.key 2048
              openssl req -x509 -new -nodes -key ca.key -sha256 -days 3650 \
                -out ca.crt -subj "/CN=vault-config-operator-ca"

              # Generate server key and CSR
              openssl genrsa -out tls.key 2048
              openssl req -new -key tls.key -out server.csr \
                -subj "/CN=vault-config-operator-webhook-service.${NS}.svc"

              # Create extension file for SAN
              cat > ext.cnf << EXTEOF
              authorityKeyIdentifier=keyid,issuer
              basicConstraints=CA:FALSE
              keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
              subjectAltName = @alt_names

              [alt_names]
              DNS.1 = vault-config-operator-webhook-service
              DNS.2 = vault-config-operator-webhook-service.{{ .Release.Namespace }}
              DNS.3 = vault-config-operator-webhook-service.{{ .Release.Namespace }}.svc
              DNS.4 = vault-config-operator-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
              EXTEOF

              # Sign the certificate
              openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
                -CAcreateserial -out tls.crt -days 3650 -sha256 -extfile ext.cnf

              kubectl delete secret webhook-server-cert -n "$NS" 2>/dev/null || true
              kubectl create secret generic webhook-server-cert \
                --from-file=tls.crt=tls.crt \
                --from-file=tls.key=tls.key \
                --from-file=ca.crt=ca.crt \
                -n "$NS"
              echo "Created webhook-server-cert secret"

              CA_BUNDLE=$(base64 < ca.crt | tr -d '\n')
              patch_all "$CA_BUNDLE"
              echo "Webhook CA bundles verified present on every entry"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
{{- end }}

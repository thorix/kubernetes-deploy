# LiteLLM proxy - internal-only OpenAI-compatible gateway.
#
# Models are defined in config.yaml below, NOT in the database:
# store_model_in_db is false, so UI/API model edits can't drift from git.
# Virtual keys, teams and spend do live in Postgres (litellm-postgres).

# -> resources named "litellm", selector app.kubernetes.io/name=litellm
nameOverride: litellm

image:
  repository: ghcr.io/berriai/litellm
  # Pinned by digest: LiteLLM had a backdoored PyPI release in March 2026.
  tag: "v1.104.3@sha256:c1909418aea76c798222f701ccd27a1b963d8cf713f797fa072fd222a6a774a4"

args:
- --config
- /app/config/config.yaml
- --port
- "4000"
# Separate unauthenticated metrics process; /metrics on 4000 needs a key.
- --prometheus_metrics_port
- "4001"

containerPort: 4000

envFrom:
- secretRef:
    # LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL, ANTHROPIC_API_KEY,
    # OTEL_HEADERS ("Authorization=Bearer <Lens tracing key>")
    name: litellm-app

# Every request is traced to Lens over OTLP. Swap for the native Lens
# connection (LITELLM_LENS_URL / LITELLM_LENS_SERVICE_TOKEN) once a LiteLLM
# release ships it - that also records costs against traces.
env:
- name: OTEL_EXPORTER
  value: otlp_http
- name: OTEL_ENDPOINT
  value: http://lens.lens.svc.cluster.local:4318/v1/traces
- name: OTEL_SERVICE_NAME
  value: litellm

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4001"
  prometheus.io/path: "/metrics"

service:
  port: 4000
  # Listed without a link: LiteLLM is internal-only (admin UI unexposed).
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "LiteLLM"
    gethomepage.dev/description: "Model gateway for chat apps and Holmes (internal only)"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "mdi-router-network"

probes:
  enabled: true
  liveness:
    path: /health/liveliness
    port: http
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 5
  readiness:
    path: /health/readiness
    port: http
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    memory: 2Gi

serviceAccount:
  create: true

# Keep the gateway up when bock (the GPU node) goes away.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: NotIn
          values: ["bock"]

vault:
  enabled: true
  kubernetes:
    role: litellm
  secrets:
    app: "litellm/app"

# Internal only: no HTTPRoute. Callers are allowlisted by namespace.
networkPolicy:
  enabled: true
  ingress:
    customRules:
    - fromEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: open-webui
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: librechat
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: holmesgpt
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: n8n
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: litellm
      toPorts:
      - ports:
        - port: "4000"
          protocol: TCP
    - fromEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: victoriametrics
      toPorts:
      - ports:
        - port: "4001"
          protocol: TCP

configMap:
  enabled: true
  mountPath: /app/config
  files:
    config.yaml: |
      model_list:
      # --- Ollama on bock ---
      - model_name: qwen3-30b
        litellm_params:
          model: ollama_chat/qwen3:30b-a3b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: qwen3-14b
        litellm_params:
          model: ollama_chat/qwen3:14b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: qwen2.5-32b
        litellm_params:
          model: ollama_chat/qwen2.5:32b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: qwen2.5-7b
        litellm_params:
          model: ollama_chat/qwen2.5:7b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: granite3.3-8b
        litellm_params:
          model: ollama_chat/granite3.3:8b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: qwen3-vl-4b
        litellm_params:
          model: ollama_chat/qwen3-vl:4b-instruct
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: minicpm-v-8b
        litellm_params:
          model: ollama_chat/minicpm-v:8b
          api_base: http://ollama.ollama.svc.cluster.local:11434
      - model_name: nomic-embed-text
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://ollama.ollama.svc.cluster.local:11434
        model_info:
          mode: embedding
      # --- llama.cpp on bock ---
      - model_name: gemma3-4b
        litellm_params:
          model: openai/unsloth/gemma-3-4b-it-GGUF:Q4_K_XL
          api_base: http://llama-cpp-service.llama.svc.cluster.local:8080/v1
          api_key: none
      # --- Anthropic (any claude-* model id passes through) ---
      - model_name: "claude-*"
        litellm_params:
          model: "anthropic/claude-*"
          api_key: os.environ/ANTHROPIC_API_KEY

      litellm_settings:
        callbacks: ["prometheus", "otel"]
        drop_params: true
        # Holmes investigations can run long; holmes-alert-relay waits 900s.
        request_timeout: 900
        # No cloud fallbacks yet (task #159): local models stay local.

      general_settings:
        master_key: os.environ/LITELLM_MASTER_KEY
        database_url: os.environ/DATABASE_URL
        store_model_in_db: false

server:
  datasource:
    url: http://victoriametrics-victoria-metrics-single-server:8428
  remote:
    write:
      url: http://victoriametrics-victoria-metrics-single-server:8428
  notifier:
    alertmanager:
      # Must be the chart's generated Service name -- release name "vmalert" plus
      # chart name "victoria-metrics-alert" plus "-alertmanager". The short form
      # "vmalert-alertmanager" does not exist and never has: vmalert logged
      # "lookup vmalert-alertmanager ... no such host" on every rule evaluation
      # since the initial commit, so NO alert from any group was ever delivered.
      # Compare datasource.url above, which uses the same generated-name pattern.
      url: http://vmalert-victoria-metrics-alert-alertmanager:9093
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  config:
    alerts:
      groups:
      - name: blackbox
        rules:
        - alert: EndpointDown
          expr: probe_success == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Endpoint {{ $labels.instance }} is down"
            description: "HTTP probe has been failing for more than 2 minutes."
        - alert: EndpointSlowResponse
          expr: probe_http_duration_seconds{phase="transfer"} > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Endpoint {{ $labels.instance }} slow response"
            description: "HTTP probe transfer phase taking more than 5 seconds."
        - alert: PlexDown
          expr: probe_success{job="blackbox-internal", instance=~".*plex.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Plex is down (internal probe failing)"
            description: "Internal HTTP probe to Plex service has been failing for 1 minute. Users cannot stream."
        - alert: SSLCertExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "SSL cert for {{ $labels.instance }} expires in less than 7 days"
      - name: kubernetes
        rules:
        - alert: PodCrashLoopBackOff
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
        - alert: ContainerRestarting
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted {{ $value }} times in 1h"
        - alert: PodNotReady
          expr: kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
        - alert: HighMemoryUsage
          expr: container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.9 and container_spec_memory_limit_bytes > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} memory usage above 90%"
        - alert: HighCPUThrottling
          expr: rate(container_cpu_cfs_throttled_periods_total[5m]) / rate(container_cpu_cfs_periods_total[5m]) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} CPU throttled >50%"
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
      # Staleness — the failure mode where nothing crashes and nothing syncs
      # wrong, and a scheduled job simply stops succeeding. Pod health and
      # ArgoCD sync status both stay green through it, because the workload is
      # not what failed; the job runs, exits non-zero, and is collected. Nothing
      # else in this ruleset looks at whether a CronJob is actually completing.
      - name: backups
        rules:
        # The threshold is 2.5x each job's OWN period, derived from its schedule,
        # so a daily job alerts after ~2 missed days and the weekly news-digest
        # after ~2 missed weeks. Suspended jobs (vrestic-thorix) have no
        # next_schedule_time series and drop out of the join automatically, so
        # there is no allowlist to keep in step.
        #
        # The scalar MUST sit inside the parentheses. Written the other way, as
        # `2.5 * on(namespace, cronjob) (...)`, the whole expression silently
        # returns nothing — on() cannot modify a scalar operand. That form was
        # written first and validated at 0 series, which reads identically to
        # "everything is healthy". A rule that can never fire, guarding against
        # things that never fire. Verified by re-running with a ~0 threshold and
        # confirming all 12 active jobs matched.
        - alert: CronJobStale
          expr: (time() - kube_cronjob_status_last_successful_time) > on(namespace, cronjob) (2.5 * (kube_cronjob_next_schedule_time - on(namespace, cronjob) kube_cronjob_status_last_schedule_time))
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in 2.5+ of its own schedule periods"
            description: "Last success is stale relative to this job's own schedule. Read the most recent pod logs before assuming the workload is at fault: the cause is usually outside it — a missing mount, a stale lock left by a killed run, or an unreachable remote."
        # A job that has NEVER succeeded has no last_successful_time series at
        # all, so CronJobStale cannot fire for it — the metric it subtracts from
        # does not exist. A never-succeeded job and a perfectly healthy one both
        # produce zero rows from a staleness rule, which is why this needs to be
        # a separate check rather than a looser threshold on the first one.
        - alert: CronJobNeverSucceeded
          expr: kube_cronjob_next_schedule_time unless on(namespace, cronjob) kube_cronjob_status_last_successful_time
          for: 48h
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has never recorded a successful run"
            description: "Scheduled, not suspended, and no success has ever been recorded. Staleness rules are blind to this case because there is no timestamp to compare against."
      - name: storage
        rules:
        - alert: PVCUsageHigh
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15 and kubelet_volume_stats_capacity_bytes > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} usage is high"
            description: "Less than 15% space remaining."
        - alert: PVCUsageCritical
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.05 and kubelet_volume_stats_capacity_bytes > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is almost full"
            description: "Less than 5% space remaining."
        - alert: PVCFillingUp
          expr: predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0 and kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.4 and kubelet_volume_stats_capacity_bytes > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} predicted to fill within 24h"
            description: "Based on 6h trend, volume will run out of space within a day."
      - name: longhorn
        rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is degraded"
            description: "Volume has fewer healthy replicas than requested. Data redundancy is reduced."
        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is faulted"
            description: "Volume has lost all redundancy or is in an error state. Immediate action required."
        - alert: LonghornNodeNotReady
          expr: longhorn_node_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node {{ $labels.node }} is not ready"
            description: "Storage node is not ready. No new replicas can be scheduled on this node."
        - alert: LonghornDiskNotSchedulable
          expr: longhorn_node_status{condition="schedulable"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node {{ $labels.node }} disk is not schedulable"
            description: "Disk cannot accept new replicas. Check disk health and available space."
        - alert: LonghornDiskSpaceLow
          expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn disk on {{ $labels.node }} is over 85% full"
            description: "Longhorn storage disk is running low on space. Replica scheduling may fail."
      - name: immich
        rules:
        - alert: ImmichPostgresHighMemory
          expr: container_memory_working_set_bytes{namespace="immich", pod=~"immich-postgres.*", container="immich-postgres"} / container_spec_memory_limit_bytes{namespace="immich", pod=~"immich-postgres.*", container="immich-postgres"} > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Immich PostgreSQL memory usage above 85%"
            description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit. Risk of OOMKill."
        - alert: ImmichPostgresRestarted
          expr: increase(kube_pod_container_status_restarts_total{namespace="immich", pod=~"immich-postgres.*"}[1h]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Immich PostgreSQL restarted"
            description: "PostgreSQL container has restarted in the last hour. Check for OOMKill or crash."
        - alert: ImmichServerHighMemory
          expr: container_memory_working_set_bytes{namespace="immich", pod=~"immich-server.*", container="immich-server"} / container_spec_memory_limit_bytes{namespace="immich", pod=~"immich-server.*", container="immich-server"} > 0.85
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Immich server memory usage above 85%"
            description: "Pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit. Current: {{ $value | humanize }}. May OOMKill soon."
        # Alerts on the CronJob not having SUCCEEDED recently, rather than on a
        # failed Job object existing.
        #
        # kube_job_status_failed counts failed Job objects that are still in the
        # cluster, and this CronJob keeps failedJobsHistoryLimit: 3. So three runs
        # that failed on 2026-06 and 2026-08-29/30 (during the red rebuild, when the
        # SMB share holding the dumps was unreachable) pinned this alert on forever,
        # while the verification itself had been succeeding daily for over a week.
        # Same sticky-alert defect as the OOM rules: an alert that fires forever is
        # indistinguishable from one that never fires.
        #
        # The replacement is also strictly broader. The old rule could only fire when
        # a failed Job existed, so it was blind to the CronJob being suspended, the
        # controller never scheduling it, or the Jobs being pruned -- all of which
        # stop verification just as dead. "Has not succeeded in 2 days" catches every
        # one of those, and self-clears the moment a run succeeds.
        #
        # 2 days rather than 1: the schedule is daily at 03:00, so a single missed or
        # retried run is not yet a problem worth waking someone for.
        - alert: ImmichBackupVerifyStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="immich", cronjob="immich-backup-verify"} > 86400 * 2
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Immich backup verification has not succeeded in over 2 days"
            description: "Last successful run was {{ $value | humanizeDuration }} ago. Today's pg_dump may be missing, corrupted, or unreachable -- or the CronJob may be suspended or not scheduling. Check: kubectl get cronjob,job -n immich | grep backup-verify"
        # Absent means the CronJob itself is gone from the cluster, which the staleness
        # rule above cannot see -- no metric, no comparison, no alert.
        - alert: ImmichBackupVerifyMissing
          expr: absent(kube_cronjob_status_last_successful_time{namespace="immich", cronjob="immich-backup-verify"})
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Immich backup verification CronJob is missing"
            description: "kube_cronjob_status_last_successful_time reports nothing for immich-backup-verify, so the CronJob has been deleted or has never completed a successful run. Nothing is checking that the nightly pg_dump exists."
      # Both rules read kube_pod_container_status_last_terminated_*, which describes
      # the LAST termination and therefore persists for the whole lifetime of the
      # pod. Ungated they are sticky: a container killed once keeps firing critical
      # forever. Measured on 2026-09-09, 39 series were firing from terminations up
      # to 17 DAYS old, mostly longhorn pods SIGKILLed during node drains. That is
      # not a backlog that drains -- long-lived pods never clear it.
      #
      # So both are gated on the container having actually restarted in the last
      # hour. kube_pod_container_status_restarts_total is a real counter, so
      # increase() is correct here. The gate took 39 firing series down to 2, and
      # those 2 were a genuine ongoing OOM loop in opnsense-mcp that the other 37
      # were burying. An alert that fires forever is indistinguishable from one
      # that never fires.
      - name: oom
        rules:
        - alert: ContainerOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1 and on(namespace,pod,container) increase(kube_pod_container_status_restarts_total[1h]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled"
            description: "Container was terminated due to exceeding its memory limit, and has restarted within the last hour. Review resource limits and consider increasing."
        # `unless` the OOMKilled rule above: exit 137 IS how an OOMKill surfaces, so
        # without this one OOM raised two critical pages for the same container.
        # What is left here is a SIGKILL that was not an OOM -- an eviction, a drain
        # or a failed liveness probe -- which is a different problem with a
        # different fix, and is why the summary no longer guesses "likely OOMKilled".
        - alert: ContainerExitCode137
          expr: (kube_pod_container_status_last_terminated_exitcode == 137 and on(namespace,pod,container) increase(kube_pod_container_status_restarts_total[1h]) > 0) unless on(namespace,pod,container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was SIGKILLed (exit 137, not an OOM)"
            description: "Container restarted within the last hour after a SIGKILL that kube-state-metrics does not attribute to OOM -- typically an eviction, a node drain, or a liveness probe timeout."
      - name: argocd
        rules:
        - alert: ArgoCDRepoServerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="argocd", deployment="argocd-repo-server"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD repo-server has zero available replicas — all syncs are blocked"
        - alert: ArgoCDAppSyncFailed
          expr: argocd_app_info{sync_status="Unknown"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} sync status Unknown for 15m"

      # Disk health for hosts that sit outside the cluster and so are not covered
      # by the kubernetes-nodes job: SMART attributes and ZFS pool errors,
      # collected by smartctl_exporter and a zpool textfile exporter.
      #
      # Design note, and the whole reason these rules look the way they do: SMART
      # raw values are CUMULATIVE lifetime counters that never reset. Any disk
      # with history will show a non-zero total, so an absolute threshold tends
      # to fire on deployment and never clear. The counter alerts below therefore
      # fire on the DELTA — a disk actively getting worse — not on the total.
      # A static count may be years old and harmless; a rising one is not.
      #
      # The delta is written as `X - min_over_time(X[24h])`, NOT `increase(X[24h])`.
      # Both smartctl_device_attribute and zpool_vdev_errors_total are exported as
      # GAUGES (the latter despite its _total suffix), and increase() is a counter
      # function: it extrapolates to the edges of the range, so a series that only
      # started partway through the window reports a jump that never happened.
      # That is not hypothetical — every one of these rules fired the moment red's
      # exporters were reinstalled, on counters that were provably flat.
      # Subtracting the window's own floor is immune to that, and it also stays
      # quiet through a `zpool clear` (value and floor both drop to zero together)
      # where max_over_time would report a phantom rise.
      #
      # NvmeMediaErrorsIncreasing below keeps increase() on purpose:
      # smartctl_device_media_errors really is exported as a counter.
      #
      # State alerts (pool not ONLINE, SMART self-assessment failed, permanent
      # data errors) DO fire on absolute state, because those need attention
      # regardless of when they started.
      #
      # Deliberately NOT alerting on smartctl_device_percentage_used: some SSD
      # firmware reports wear figures that disagree wildly with actual bytes
      # written, which would make that field a permanent false alarm. Available
      # spare and media errors are the trustworthy NVMe signals.
      # Liveness of the image-inquisitor scan.
      #
      # Nothing noticed this CronJob dying, and nothing could: a CronJob has no
      # long-lived pod, so PodNotReady and CrashLoopBackOff never apply. The scan
      # simply stops and every dashboard keeps rendering the previous result --
      # indistinguishable from a healthy cluster whose numbers have not moved.
      #
      # Both rules wrap last_over_time(...[7d]). The scan runs once a day and
      # VictoriaMetrics' default lookback is five minutes, so the bare metric is
      # absent for 23h55m out of every 24h. An alert written against it directly
      # would fire permanently and be silenced within a day, which is worse than
      # having no alert at all.
      # Loki silently discarding logs.
      #
      # This is the quietest failure in the stack. A line over max_line_size is
      # rejected at ingest with NO error in Loki's log, none in Alloy's, and no
      # gap any query can tell apart from "nothing was logged". The only evidence
      # is a counter that nothing was collecting until the Loki pods were
      # annotated for scraping.
      #
      # It had already cost us: image-inquisitor's vulnerability lines reached
      # 7 MB because they embedded the full CVE list, and since line size scales
      # with CVE count the images being dropped were exactly the ones with the
      # most vulnerabilities. 17 of 121 never arrived, so the CVE dashboard
      # under-reported worst-first for its entire existence.
      #
      # Alerting on the RATE, not the total. These counters are cumulative and
      # already carry millions of historical drops, so any absolute threshold
      # fires immediately and forever -- the same sticky-alert trap as the OOM
      # rules. A rate answers the question that matters: are we losing logs NOW.
      - name: loki-ingest
        rules:
        - alert: LokiDroppingOversizedLines
          expr: sum(rate(loki_discarded_samples_total{reason="line_too_long"}[30m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Loki is discarding log lines for exceeding max_line_size"
            description: "Lines are being rejected at ingest and there is no other signal that this is happening -- no error in Loki, none in Alloy, and the data simply appears never to have been logged. Find the source with: sum by (namespace) (rate(loki_discarded_samples_total[30m])). Either shrink what the producer emits or raise limits_config.max_line_size."
        - alert: LokiDiscardingLogs
          expr: sum by (reason) (rate(loki_discarded_samples_total{reason!="line_too_long"}[30m])) > 10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Loki is discarding logs: {{ $labels.reason }} ({{ $value | humanize }}/s)"
            description: "Sustained log loss for reason '{{ $labels.reason }}'. rate_limited means ingestion_rate_mb is too low for current volume; too_far_behind and greater_than_max_sample_age mean timestamps fall outside the accepted window, usually a producer backfilling or a clock problem. Threshold is 10/s so ordinary bursts do not page."
      - name: image-inquisitor
        rules:
        - alert: ImageInquisitorScanStale
          expr: (time() - last_over_time(image_inquisitor_scan_timestamp_seconds[7d])) > 86400 * 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Image vulnerability scan has not completed in {{ $value | humanizeDuration }}"
            description: "The daily image-inquisitor scan last finished {{ $value | humanizeDuration }} ago, so the CVE dashboards are showing stale data while looking perfectly normal. Two days allows one missed run before alerting. Check: kubectl get cronjob,job -n image-inquisitor"
        # absent() is the only way to catch the CronJob being deleted or never
        # having run: with no series at all there is nothing for the staleness
        # comparison above to evaluate.
        - alert: ImageInquisitorScanMissing
          expr: absent(last_over_time(image_inquisitor_scan_timestamp_seconds[7d]))
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Image vulnerability scanning has stopped entirely"
            description: "No image-inquisitor scan has been recorded in seven days. The CronJob is likely deleted, suspended, or has never successfully published metrics. Nothing is checking running images for CVEs."
      - name: disk-health
        rules:
        - alert: SmartCounterIncreasing
          expr: (smartctl_device_attribute{attribute_value_type="raw", attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect"} - min_over_time(smartctl_device_attribute{attribute_value_type="raw", attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect"}[24h])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SMART {{ $labels.attribute_name }} rising on {{ $labels.instance }} {{ $labels.device }}"
            description: "Up by {{ $value }} in 24h. A growing count means the disk is degrading now; a static count may be years old and harmless."
        - alert: SmartCrcErrorsIncreasing
          expr: (smartctl_device_attribute{attribute_value_type="raw", attribute_name="UDMA_CRC_Error_Count"} - min_over_time(smartctl_device_attribute{attribute_value_type="raw", attribute_name="UDMA_CRC_Error_Count"}[24h])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SMART CRC errors rising on {{ $labels.instance }} {{ $labels.device }}"
            description: "Up by {{ $value }} in 24h. CRC errors point at the cable or connection, not the platter — reseat before replacing the disk."
        - alert: SmartHealthFailed
          expr: smartctl_device_smart_status == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "SMART self-assessment FAILED on {{ $labels.instance }} {{ $labels.device }}"
            description: "Drive reports overall-health FAILED. Confirm it is genuine wear and not a firmware reporting bug before replacing."
        - alert: NvmeAvailableSpareLow
          expr: smartctl_device_available_spare <= smartctl_device_available_spare_threshold
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "NVMe spare capacity exhausted on {{ $labels.instance }} {{ $labels.device }}"
            description: "Available spare has fallen to its threshold. Unlike percentage-used, this reflects real remapping and is not affected by firmware wear-reporting quirks."
        - alert: NvmeMediaErrorsIncreasing
          expr: increase(smartctl_device_media_errors[24h]) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "NVMe media errors rising on {{ $labels.instance }} {{ $labels.device }}"
            description: "Up by {{ $value }} in 24h. Unrecoverable data integrity errors — back up before doing anything else."
        - alert: ZpoolNotOnline
          expr: zpool_state{state="ONLINE"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is not ONLINE"
            description: "Pool has lost a device or is otherwise degraded. On a raidz1 pool this means zero remaining parity — a second failure loses the pool."
        - alert: ZpoolDataErrors
          expr: zpool_data_errors > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool {{ $labels.pool }} on {{ $labels.instance }} reports {{ $value }} permanent data errors"
            description: "Files are unrecoverable from parity. Run 'zpool status -v' to list them, restore from backup, then 'zpool clear'."
        - alert: ZpoolVdevErrorsIncreasing
          expr: (zpool_vdev_errors_total - min_over_time(zpool_vdev_errors_total[24h])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ZFS {{ $labels.type }} errors rising on {{ $labels.pool }} vdev {{ $labels.vdev }}"
            description: "Up by {{ $value }} in 24h on {{ $labels.instance }}. Note these counters reset on 'zpool clear' and on import, so this is since the last clear."
        - alert: DiskMetricsExporterDown
          expr: up{job=~"(red|oatmeal)-(node|smart)"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Disk metrics exporter {{ $labels.job }} is down"
            description: "No SMART or ZFS data is being collected from {{ $labels.instance }}, so disk degradation would go unnoticed."

alertmanager:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  config:
    receivers:
    - name: slack-critical
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/SLACK_WEBHOOK_URL
        channel: "#alerts"
        color: danger
        title: "{{ .Status | toUpper }} | {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
    - name: slack-warning
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/SLACK_WEBHOOK_URL
        channel: "#alerts"
        color: warning
        title: "{{ .Status | toUpper }} | {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
    route:
      receiver: slack-warning
      group_by:
      - alertname
      - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - receiver: slack-critical
        matchers:
        - severity = critical
  extraVolumes:
  - name: slack-secret
    secret:
      secretName: vmalert-slack
  extraVolumeMounts:
  - name: slack-secret
    mountPath: /etc/alertmanager/secrets
    readOnly: true
  service:
    annotations: {}

{{- if .Values.letsEncrypt.enabled }}
{{- range .Values.letsEncrypt.certificates }}
---
# Wildcard certificate for {{ .name }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.letsEncrypt.certificateNamespace }}
  labels:
    {{- include "cert-manager-wrapper.labels" $ | nindent 4 }}
spec:
  secretName: {{ .secretName }}
  duration: {{ .duration | default "2160h" }}
  renewBefore: {{ .renewBefore | default "360h" }}
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - client auth
  dnsNames:
    {{- range .dnsNames }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ $.Values.letsEncrypt.clusterIssuerName }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
{{- end }}

alloy:
  configMap:
    content: |
      // Discover the pods on THIS node only.
      //
      // Alloy runs as a DaemonSet, and loki.source.kubernetes tails through the
      // API server, not from files on the node. Without a node selector every
      // Alloy pod discovered and tailed every pod in the cluster, so each line
      // was shipped once per node. Loki silently drops exact duplicates, so
      // nothing looked wrong in queries -- but every copy still counted against
      // Loki's ingestion rate limit, and every Alloy pod paid the CPU and memory
      // of tailing the whole cluster, which can starve Alloy on small nodes
      // badly enough that its readiness probe times out.
      //
      // The chart sets HOSTNAME to spec.nodeName for exactly this selector.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Relabel to extract useful metadata
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Drop pods without a name
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "drop"
          regex         = ""
        }

        // Set namespace label
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        // Set pod label
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        // Set container label
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Set node label
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        // Set app label from k8s labels
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        // Fallback app label from "app" label
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
          regex         = "(.+)"
        }
      }

      // Collect logs from discovered pods
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      // Process and add labels
      loki.process "pods" {
        // Detect log level from common patterns
        stage.logfmt {
          mapping = { "level" = "" }
        }
        stage.labels {
          values = { "level" = "" }
        }

        forward_to = [loki.write.default.receiver]
      }

      // Ship logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.victoriametrics.svc:3100/loki/api/v1/push"
        }
      }

  mounts:
    varlog: true

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    # Working set sat at the old 256Mi limit, where the Go runtime spends its
    # time in GC instead of serving /-/ready (1s probe timeout). Under memory
    # pressure the config-reloader's /-/reload calls time out too, so a config
    # change never takes effect on the pod that most needs it. A limit with
    # real headroom keeps both endpoints responsive; this change also rolls
    # the DaemonSet, which applies the node-scoped discovery config cleanly.
    limits:
      memory: 512Mi

controller:
  type: daemonset
  # Run on tainted control planes too.
  #
  # Control planes that are not intended to carry workloads keep the
  # node-role.kubernetes.io/control-plane:NoSchedule taint. Without a matching
  # toleration the Alloy DaemonSet silently skips those nodes.
  #
  # That gap is easy to miss: a DaemonSet reports N/N Ready counting only
  # *eligible* nodes, so partial coverage looks identical to full coverage.
  # Collection must tolerate the taint, or tainting a node also stops observing
  # it -- which is the opposite of what you want at the moment you taint it.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

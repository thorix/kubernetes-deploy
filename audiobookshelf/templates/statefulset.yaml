apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: {{ .Values.audiobookshelf.uid }}
        runAsGroup: {{ .Values.audiobookshelf.gid }}
        fsGroup: {{ .Values.audiobookshelf.fsGroup }}
      containers:
      - name: audiobookshelf
        image: {{ .Values.audiobookshelf.image }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: TZ
          value: {{ .Values.audiobookshelf.timezone | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
        resources:
          {{- toYaml .Values.audiobookshelf.resources | nindent 10 }}
        volumeMounts:
        - name: config-metadata
          subPath: config
          mountPath: /config
        - name: config-metadata
          subPath: metadata
          mountPath: /metadata
        # subPaths are relative to the SMB share root, so the library layout on
        # the NAS is env-specific and lives in the private overlay. readOnly is
        # safe by default: Audiobookshelf keeps its database, metadata and cached
        # covers on the config-metadata volume, and only writes into the library
        # if "store metadata/cover with item" is enabled in server settings.
        - name: data
          subPath: {{ .Values.smb.media.audiobooksSubPath | default "audiobooks" }}
          mountPath: /audiobooks
          readOnly: {{ .Values.smb.media.readOnly | default false }}
        - name: data
          subPath: {{ .Values.smb.media.podcastsSubPath | default "podcasts" }}
          mountPath: /podcasts
          readOnly: {{ .Values.smb.media.readOnly | default false }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
  volumeClaimTemplates:
  - metadata:
      name: config-metadata
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: {{ .Values.audiobookshelf.storage.configMetadataStorageClass }}
      resources:
        requests:
          storage: {{ .Values.audiobookshelf.storage.configMetadataSize }}

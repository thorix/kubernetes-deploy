apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Release.Name }}-auth
  namespace: {{ .Release.Namespace }}
spec:
  vaultConnectionRef: {{ .Release.Name }}-connection
  method: kubernetes
  mount: {{ .Values.vault.kubernetes.mountPath }}
  kubernetes:
    role: {{ .Values.vault.kubernetes.role }}
    serviceAccount: {{ .Values.vault.kubernetes.serviceAccount }}
    audiences:
      - {{ .Values.vault.kubernetes.audience }}

# Anthropic API Key
{{- if .Values.endpoints.anthropic.enabled }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-anthropic
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: {{ .Release.Name }}-auth
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.secrets.anthropic }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ .Release.Name }}-anthropic
    create: true
{{- end }}
---
# MongoDB Credentials
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-mongodb-creds
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: {{ .Release.Name }}-auth
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.secrets.mongodb }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ .Release.Name }}-mongodb-creds
    create: true
    transformation:
      excludeRaw: true
      templates:
        username:
          text: "{{ `{{ .Secrets.username }}` }}"
        password:
          text: "{{ `{{ .Secrets.password }}` }}"
        MONGO_URI:
          text: "mongodb://{{ `{{ .Secrets.username }}` }}:{{ `{{ .Secrets.password }}` }}@{{ .Release.Name }}-mongodb:27017/librechat?authSource=admin"
---
# JWT Secrets for sessions
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-jwt
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: {{ .Release.Name }}-auth
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.secrets.jwt }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ .Release.Name }}-jwt
    create: true
---
# Credential encryption keys
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Release.Name }}-creds
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: {{ .Release.Name }}-auth
  mount: {{ .Values.vault.mount }}
  type: kv-v2
  path: {{ .Values.vault.secrets.creds }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ .Release.Name }}-creds
    create: true

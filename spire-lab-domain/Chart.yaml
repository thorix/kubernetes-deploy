apiVersion: v2
name: spire-lab-domain
description: Shared wrapper chart for one SPIRE trust domain (server, agents, CSI driver, OIDC discovery provider, Vault-sourced upstream CA, federation bundle endpoint). Deployed once per trust domain by spire-infra and spire-workload.
type: application
version: 0.1.0
appVersion: "1.15.5"

dependencies:
  - name: spire
    version: "0.30.4"
    repository: https://spiffe.github.io/helm-charts-hardened/

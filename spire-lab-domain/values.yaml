# spire-lab-domain: shared defaults for one SPIRE trust domain. It has no
# deploy.yaml; spire-infra/ and spire-workload/ each deploy it with a values
# file holding only their per-release settings. Two releases share every node,
# so every per-release name, port, socket path and class must differ (layout of
# the spire chart's examples/federation). Those settings are deliberately left
# unset here: trustDomain falls back to the chart's example.org, which the
# chart's strict mode rejects, so a release without its own values fails to
# render instead of colliding with the other one.
#
# Per-release settings (see spire-infra/values.yaml, spire-workload/values.yaml):
#   spire.global.spire: trustDomain, clusterName, bundleConfigMap,
#     caSubject.commonName, namespaces.{system,server}.name
#   spire.spire-server: upstreamAuthority.disk.secret.name, controllerManager.className
#   spire.spire-agent: socketPath, healthChecks.port, telemetry.prometheus.port
#   spire.spiffe-csi-driver: pluginName, agentSocketPath, healthChecks.port
#   spire.spiffe-oidc-discovery-provider: csiDriverName
#   vault.secrets.upstreamCA, vault.kubernetes.role
#
#   federation.peer.trustDomain
#
# Env overlay sets: spire.global.spire.clusterName, spire.global.spire.jwtIssuer,
# bundleEndpoint.loadBalancerIP, federation.peer.{bundleEndpointURL,
# trustDomainBundle} and oidc.httpRoute.{hostname,parentRef.sectionName}.

# Federation bundle endpoint exposed on a LoadBalancer IP (wrapper template).
bundleEndpoint:
  enabled: true
  port: 8443
  loadBalancerIP: ""  # Set in the env overlay (lbipam.cilium.io/ips)

# Federation with the peer trust domain (templates/federation.yaml): one
# ClusterFederatedTrustDomain, profile https_spiffe. Not rendered until
# bundleEndpointURL is set; then trustDomain and trustDomainBundle are required.
federation:
  peer:
    trustDomain: ""        # Per release: the other lab trust domain
    bundleEndpointURL: ""  # Env overlay: https://<peer bundle endpoint>:8443
    endpointSPIFFEID: ""   # Defaults to spiffe://<trustDomain>/spire/server
    # Env overlay: the peer's root CA as a SPIFFE bundle (JSON), the shape of
    # `spire-server bundle show -format spiffe`: one keys[] entry with
    # use x509-svid, kty/crv/x/y and x5c.
    trustDomainBundle: ""

# OIDC discovery provider published through an existing Gateway
# (templates/oidc-httproute.yaml). Not rendered until hostname is set; the
# hostname must be the host of spire.global.spire.jwtIssuer.
oidc:
  httpRoute:
    hostname: ""  # Env overlay
    parentRef:
      name: https-gateway
      namespace: kube-system
      sectionName: ""  # Env overlay: the Gateway listener; empty attaches to all
    backend:
      serviceName: ""  # Defaults to <release>-spiffe-oidc-discovery-provider
      port: 80         # The provider Service's http port (nginx, plain HTTP)

# Vault integration: the upstream CA reaches the cluster through VSO as the
# Secret named by spire.spire-server.upstreamAuthority.disk.secret.name. VSO
# authenticates as a dedicated ServiceAccount, <release>-vso, created by this
# chart in the server namespace, so no other pod there can read the CA key.
vault:
  enabled: true
  address: "http://vault.vault.svc.cluster.local:8200"
  skipTLSVerify: true
  mount: kv
  refreshAfter: 1h
  secrets:
    upstreamCA: ""  # Per release: <release>/ca (fields tls.crt, tls.key)
  kubernetes:
    mountPath: kubernetes
    role: ""  # Per release
    audience: vault
    tokenTTL: 86400

# Upstream spire chart
spire:
  global:
    spire:
      recommendations:
        enabled: true  # PSS privileged on the system namespace, Prometheus exporters
      namespaces:
        create: true
      # Subject of the SPIRE intermediate CA (signed by the upstream root).
      # Required by the chart's strict mode. XX is the ISO user-assigned code.
      caSubject:
        country: XX
        organization: SPIFFE lab
    # Argo CD maps pre-upgrade hooks to PreSync, which breaks the first sync.
    installAndUpgradeHooks:
      enabled: false
    deleteHooks:
      enabled: false

  spire-server:
    # Workload SVIDs are short so rotation is visible. Agent SVIDs are not:
    # without agentTTL they would inherit 5m and confound server-outage tests.
    defaultX509SvidTTL: 5m
    defaultJwtSvidTTL: 5m
    agentTTL: 1h
    federation:
      enabled: true
    upstreamAuthority:
      disk:
        enabled: true
        secret:
          create: false
    controllerManager:
      filterByClassName: true
      identities:
        clusterSPIFFEIDs:
          # The default identity matches every pod in every namespace. Workloads
          # opt in through ClusterSPIFFEIDs defined with the lab apps instead.
          default:
            enabled: false
          test-keys:
            enabled: false
          # Kept: the OIDC discovery provider fetches bundles over the Workload
          # API and needs its own SVID. It selects only this release's pods.
          oidc-discovery-provider:
            enabled: true
      validatingWebhookConfiguration:
        failurePolicy: Ignore

  spiffe-oidc-discovery-provider:
    enabled: true
    tls:
      spire:
        enabled: false

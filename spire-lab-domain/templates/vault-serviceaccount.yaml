{{- if .Values.vault.enabled }}
---
# Dedicated identity for VSO's Vault login. The Vault role binds only this
# ServiceAccount, so other pods in the namespace (which run as `default` or
# their own accounts) cannot obtain a token that reads the upstream CA key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spire-wrapper.vsoServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-wrapper.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

{{- if .Values.bundleEndpoint.enabled }}
---
# Federation bundle endpoint (https_spiffe profile) on a LoadBalancer IP, so the
# peer trust domain's server can fetch this domain's bundle. Exposes only the
# bundle endpoint port of the SPIRE server pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-bundle-endpoint
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spire-wrapper.labels" . | nindent 4 }}
  {{- with .Values.bundleEndpoint.loadBalancerIP }}
  annotations:
    lbipam.cilium.io/ips: {{ . | quote }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: federation
      port: {{ .Values.bundleEndpoint.port }}
      targetPort: federation
      protocol: TCP
{{- end }}

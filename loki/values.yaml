deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
  storage:
    type: filesystem
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
    retention_period: 30d
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  # Let the kubernetes-pods scrape job collect Loki's own metrics.
  #
  # Loki already counts everything it throws away in loki_discarded_samples_total
  # and loki_discarded_bytes_total, broken down by reason. Nothing was collecting
  # them, so the drops were invisible: a line over max_line_size is rejected at
  # ingest with no error in Loki's log, none in Alloy's, and no gap that any query
  # can distinguish from "nothing was logged".
  #
  # That mattered. image-inquisitor's vulnerability lines reached 7 MB because they
  # embedded the full CVE list, and line size scales with CVE count -- so the
  # images being silently dropped were precisely the ones with the most
  # vulnerabilities. 17 of 121 never reached Loki at all, and the CVE dashboard
  # under-reported worst-first for as long as it had existed.
  #
  # The counters also show ~5M samples dropped as rate_limited and ~2M as
  # too_far_behind, which nothing has ever surfaced either.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    prometheus.io/path: "/metrics"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: longhorn

# Disable components not needed in SingleBinary mode
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable caches for single-binary filesystem mode
resultsCache:
  enabled: false
chunksCache:
  enabled: false

# Disable gateway - not needed for single-binary
gateway:
  enabled: false

# Disable minio - using filesystem storage
minio:
  enabled: false

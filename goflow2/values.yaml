# goflow2 -- NetFlow / IPFIX collector.
#
# Writes one JSON line per flow to stdout. The Alloy DaemonSet already ships
# every pod's stdout to Loki, so nothing else needs wiring: flows are queryable
# as {app="goflow2"} |= "NETFLOW_V9" | json.
#
# Use in_bytes / in_packets for traffic volume, not bytes / packets. goflow2
# writes both IN_BYTES (field 1) and OUT_BYTES (field 23) into "bytes", and
# packets likewise. Some exporters send OUT_* after IN_* in the template,
# always as 0, so "bytes" ends up 0. The mapping below copies fields 1 and 2
# into their own JSON keys.
#
# Addresses and ports stay in the log line, never in labels -- per-IP labels
# would explode Loki's index.
#
# The receiving address (a LoadBalancer VIP) is set in the private overlay.

nameOverride: goflow2

image:
  repository: netsampler/goflow2
  tag: "v2.2.7"
  pullPolicy: IfNotPresent

args:
  - -listen=netflow://:2055
  - -format=json
  - -transport=file
  - -addr=:8080
  - -mapping=/etc/goflow2/mapping.yaml

# goflow2 mapping file. Setting formatter.fields replaces goflow2's default
# JSON key list, so the defaults are listed here in full, plus the two
# custom keys.
configMap:
  enabled: true
  mountPath: /etc/goflow2
  files:
    mapping.yaml: |
      formatter:
        fields:
          - type
          - time_received_ns
          - sequence_num
          - sampling_rate
          - sampler_address
          - time_flow_start_ns
          - time_flow_end_ns
          - bytes
          - packets
          - in_bytes
          - in_packets
          - src_addr
          - dst_addr
          - etype
          - proto
          - src_port
          - dst_port
          - in_if
          - out_if
          - src_mac
          - dst_mac
          - src_vlan
          - dst_vlan
          - vlan_id
          - ip_tos
          - forwarding_status
          - ip_ttl
          - ip_flags
          - tcp_flags
          - icmp_type
          - icmp_code
          - ipv6_flow_label
          - fragment_id
          - fragment_offset
          - src_as
          - dst_as
          - next_hop
          - next_hop_as
          - src_net
          - dst_net
          - bgp_next_hop
          - bgp_communities
          - as_path
          - mpls_ttl
          - mpls_label
          - mpls_ip
          - observation_domain_id
          - observation_point_id
          - layer_stack
          - layer_size
          - ipv6_routing_header_addresses
          - ipv6_routing_header_seg_left
        protobuf:
          - name: in_bytes
            index: 1001
            type: varint
          - name: in_packets
            index: 1002
            type: varint
      netflowv9:
        mapping:
          - field: 1    # IN_BYTES
            destination: in_bytes
          - field: 2    # IN_PKTS
            destination: in_packets

# Alloy derives the Loki "app" label from this pod label.
podLabels:
  app: goflow2

# /metrics exposes goflow2's own counters (flows received, decode errors).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

ports:
  - name: netflow
    containerPort: 2055
    protocol: UDP
  - name: http
    containerPort: 8080
    protocol: TCP

# Only NetFlow is exposed on the Service; metrics and health stay pod-local.
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: netflow
      port: 2055
      targetPort: 2055
      protocol: UDP

# /__health returns 503 until goflow2's listeners are running.
probes:
  enabled: true
  liveness:
    type: http
    path: /__health
    port: http
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    type: http
    path: /__health
    port: http
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

serviceAccount:
  create: true

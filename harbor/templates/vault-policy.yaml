{{- if .Values.vault.enabled }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harbor-local.labels" . | nindent 4 }}
spec:
  connection:
    address: {{ .Values.vault.address }}
    {{- if .Values.vault.skipTLSVerify }}
    tLSConfig:
      skipVerify: true
    {{- end }}
  authentication:
    path: {{ .Values.vault.kubernetes.mountPath }}
    role: vault-config-operator
  name: {{ .Release.Name }}
  policy: |
    {{- range $key, $path := .Values.vault.secrets }}
    path "kv/data/{{ $path }}" {
      capabilities = ["read"]
    }
    path "kv/metadata/{{ $path }}" {
      capabilities = ["read", "list"]
    }
    {{- end }}
{{- end }}

      AWS Bedrock
      Click House
      Clickhouse
      Comfy UI
      Defcon
      DefCon
      DEFCON
      Elastic Search
      ElasticSearch
      Github
      Gitlab
      Hashicorp
      Javascript
      Keda
      Libre Chat
      Open Telemetry
      Open Web UI
      Opentelemetry
      OpenWebUI
      Pagerduty
      Postgresql
      Red Panda
      RedPanda
      Victoria Metrics

volumeMounts:
- name: config
  mountPath: /LanguageTool/org/languagetool/resource/en/hunspell/spelling_custom.txt
  subPath: spelling_custom.txt
  readOnly: true
- name: config
  mountPath: /LanguageTool/org/languagetool/resource/en/hunspell/prohibit_custom.txt
  subPath: prohibit_custom.txt
  readOnly: true

podAnnotations:
  languagetool.org/dictionary-sha: "182fa1adedcc"
# END custom-dictionary

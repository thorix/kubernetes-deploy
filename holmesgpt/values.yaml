# HolmesGPT configuration
# AI-powered root cause analysis for Kubernetes alerts
# Uses local Ollama for LLM inference (no external API calls)

logLevel: INFO
# The Holmes API server, used for interactive investigations, alert-triggered
# ones via holmes-alert-relay, and the scheduled checks the `operator` below
# now runs. Every investigation is an LLM call against local Ollama, so this
# server is on the path for all three.
replicas: 1

# Disable telemetry
sentryDSN: ""
enableAccountsCreate: false

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# CRD permissions for operators we use
crdPermissions:
  argo: true
  flux: false
  kafka: false
  keda: false
  crossplane: false
  istio: false
  gatewayApi: true
  velero: false
  externalSecrets: false

# AI model configuration - Ollama (local)
# NOTE: Ollama tool-calling is experimental per HolmesGPT docs.
# If results are poor, consider switching to Anthropic Claude.
# See: https://holmesgpt.dev/ai-providers/ollama/
additionalEnvVars:
- name: OLLAMA_API_BASE
  value: "http://ollama.ollama.svc.cluster.local:11434"
# Synced from Vault (kv/holmesgpt/mcp-gateway) via health-checks companion chart
- name: MCP_GATEWAY_TOKEN
  valueFrom:
    secretKeyRef:
      name: holmesgpt-mcp-gateway
      key: MCP_GATEWAY_TOKEN

modelList:
  # Trialing qwen3:30b-a3b (MoE, ~3B active) for faster, more consistent agentic
  # investigations on the Strix Halo APU node vs the dense qwen2.5:32b.
  ollama-qwen3:
    model: "ollama_chat/qwen3:30b-a3b"
    temperature: 0

# MCP Gateway - provides ArgoCD, OPNsense, and Haystack RAG tools
# Connects to the MCP Context Forge gateway (all registered servers)
mcp_servers:
  ops-gateway:
    description: "MCP gateway providing ArgoCD, OPNsense, and Haystack RAG tools for cluster operations"
    config:
      url: "http://mcp-gateway-mcpgateway.mcp-gateway.svc.cluster.local/sse"
      mode: "sse"
      extra_headers:
        Authorization: "Bearer {{ env.MCP_GATEWAY_TOKEN }}"
      verify_ssl: false

# Toolsets - data sources for investigations
toolsets:
  kubernetes/core:
    enabled: true
  kubernetes/logs:
    enabled: true
  prometheus/metrics:
    enabled: true
    config:
      prometheus_url: "http://victoriametrics-victoria-metrics-single-server.victoriametrics.svc:8428"
  grafana/loki:
    enabled: true
    config:
      api_url: "http://loki.victoriametrics.svc:3100"
  argocd:
    enabled: false  # Using MCP gateway for ArgoCD access instead
  robusta:
    enabled: false
  internet:
    enabled: false
  runbook:
    enabled: true
  bash:
    enabled: true
    config:
      builtin_allowlist: "extended"

# Disable all cloud MCP addons
mcpAddons:
  aws:
    enabled: false
  mariadb:
    enabled: false
  gcp:
    enabled: false
  azure:
    enabled: false
  github:
    enabled: false
  sentry:
    enabled: false
  prefect:
    enabled: false
  kubernetesRemediation:
    enabled: false
  confluenceMcp:
    enabled: false

# Holmes Operator - enables scheduled/automatic investigations.
#
# Previously disabled because it repeatedly exceeded its memory limit rather
# than reaching Ready. The cause was the chart default of 512Mi, which is not
# enough for a kopf operator holding CRD caches for ~28k HealthCheck objects.
# Re-enabled with 4x that limit.
#
# cleanupCompletedChecks is deliberately OFF for now. 28,300 completed
# HealthCheck objects accumulated while the operator was down, and turning
# cleanup on at the same time as the operator would have it try to prune all
# of them on first reconcile -- a deletion burst this etcd does not need while
# we are still confirming the operator is stable. Turn it on as a separate,
# deliberate step once scheduled checks are running cleanly.
operator:
  enabled: true
  logLevel: INFO
  holmesApiTimeout: 300
  maxHistoryItems: 10
  cleanupCompletedChecks: false
  completedCheckTTLHours: 48
  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 2Gi

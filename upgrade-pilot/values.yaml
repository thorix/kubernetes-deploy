# upgrade-pilot CronJob (runs every 15 minutes) -- see deploy.yaml for what this is and is not.
workloadType: CronJob

image:
  repository: harbor.lan/library/upgrade-pilot   # real registry host lives in the config overlay
  tag: "v0.2.0"
  pullPolicy: IfNotPresent

cronjob:
  schedule: "*/15 * * * *"   # every 15 minutes
  concurrencyPolicy: Forbid   # explicit: a slow tick must never overlap the next
  # No retries. A run that fails should show as a failed Job -- the next tick
  # re-clones from scratch anyway, and a retry would only push the failure
  # further from anyone's view.
  restartPolicy: Never
  backoffLimit: 0
  # The image's run script stops the tick at 780 s; this Job deadline (840 s) is the backstop,
  # so a hung run fails visibly instead of blocking every later tick under Forbid.
  activeDeadlineSeconds: 840
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# The pilot calls the Kubernetes API (kubectl) with this account; the RBAC chart
# in rbac/ binds it read-only. Named explicitly so that binding can find it.
serviceAccount:
  create: true
  name: upgrade-pilot
  automountServiceAccountToken: true

env:
  # Heartbeat target. The import endpoint takes Prometheus exposition text.
  - name: VM_URL
    value: "http://victoriametrics-victoria-metrics-single-server.victoriametrics.svc.cluster.local:8428"
  # Alertmanager and vmalert read APIs, used by the tick for alert state.
  - name: AM_URL
    value: "http://vmalert-victoria-metrics-alert-alertmanager.victoriametrics.svc:9093"
  - name: VMALERT_URL
    value: "http://vmalert-victoria-metrics-alert-server.victoriametrics.svc:8880"
  # Dry-run until switch-on: the tick evaluates and logs but changes nothing.
  - name: PILOT_TICK_MODE
    value: "--dry-run"
  - name: GIT_AUTHOR_NAME
    value: "upgrade-pilot (tick)"
  - name: GIT_AUTHOR_EMAIL
    value: "8203031+thorix@users.noreply.github.com"
  # Two fine-grained tokens, both synced from Vault (below), so that nothing in
  # the cluster can write to this repo -- the one ArgoCD deploys from.
  #   GH_TOKEN       read-only: this repo's PRs and files
  #   GH_PUSH_TOKEN  read/write on the pilot's own repo only: clone + decision log
  - name: GH_TOKEN
    valueFrom:
      secretKeyRef:
        name: upgrade-pilot-simple-service-github
        key: GH_TOKEN
  - name: GH_PUSH_TOKEN
    valueFrom:
      secretKeyRef:
        name: upgrade-pilot-simple-service-github
        key: GH_PUSH_TOKEN

vault:
  enabled: true
  kubernetes:
    role: upgrade-pilot
    serviceAccount: upgrade-pilot
  secrets:
    github: upgrade-pilot/github

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# A CronJob needs no service, route, probes or storage.
service:
  enabled: false
httproute:
  enabled: false
probes:
  enabled: false
persistence:
  enabled: false

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Base values for Homepage dashboard

# LibreChat quick-search link in the dashboard (real host set in the rye overlay)
chatSearchUrl: https://chat.lan/?prompt=

# Pinned, never a floating tag: this image gates its own health checks on app
# behaviour that changed across a major release, so an unattended :latest pull
# can break the running service with no change on our side.
image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.1.2
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 3000

# Gateway configuration
gateway:
  name: http-gateway
  namespace: kube-system

# hostname is environment-specific - set in values.<env>.yaml
hostname: ""

# Resource limits
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Service account
serviceAccount:
  name: homepage

# Security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

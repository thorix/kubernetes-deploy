# Haystack RAG Knowledge Base Configuration

# Hayhooks - REST API and MCP server for Haystack pipelines
hayhooks:
  image: deepset/hayhooks:v1.17.0
  replicas: 1

  # Pipeline dependencies are pip-installed at pod start into /opt/extra-packages,
  # which PYTHONPATH puts ahead of the image's own site-packages. Every one of
  # these must be pinned: an unpinned install silently picks up new major
  # versions and breaks hayhooks at runtime. Re-verify these when bumping the
  # image tag above.

  # Must match the haystack-ai version bundled in the image.
  # haystack-ai 3.x removed haystack.AsyncPipeline, which hayhooks v1.17.0 imports.
  haystackVersion: "2.27.0"

  # milvus-haystack builds a MilvusClient and then reuses client._using as an ORM
  # connection alias. pymilvus 2.6+ decoupled MilvusClient from the ORM connection
  # registry, so that alias is unregistered and every pipeline's setup() fails with
  # ConnectionNotExistException. 2.5.x still registers it.
  pymilvusVersion: "2.5.14"

  # hayhooks declares mcp>=1.8.0 with no upper bound. mcp 2.x removed
  # Server.list_tools, which breaks `hayhooks mcp run` (the port 1417 server).
  mcpConstraint: "<2"

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi

# Milvus vector database (standalone mode)
milvus:
  enabled: true
  cluster:
    enabled: false
  standalone:
    messageQueue: rocksmq  # Use embedded message queue
    persistence:
      enabled: true
      persistentVolumeClaim:
        size: 20Gi
        storageClass: longhorn
  etcd:
    replicaCount: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn
  minio:
    mode: standalone
    persistence:
      enabled: true
      size: 20Gi
      storageClass: longhorn
  pulsar:
    enabled: false
  pulsarv3:
    enabled: false
  kafka:
    enabled: false

# Ollama integration (existing deployment)
ollama:
  baseURL: "http://ollama.ollama.svc.cluster.local:11434"
  embeddingModel: "nomic-embed-text"

# Storage for cloned git repositories
storage:
  repos:
    enabled: true
    size: 10Gi
    storageClass: longhorn

# Service configuration
service:
  type: ClusterIP
  apiPort: 1416
  mcpPort: 1417
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Haystack"
    gethomepage.dev/description: "RAG Knowledge Base"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "mdi-database-search"
    gethomepage.dev/href: "https://haystack.lan"

# HTTPRoute configuration
httproute:
  enabled: true
  hostname: ""  # Set in values.prod.yaml
  gateway:
    name: http-gateway
    namespace: kube-system

# Indexer CronJob configuration
indexer:
  # Cron schedule (default: every 6 hours)
  schedule: "0 */6 * * *"

# Git repositories to index
repositories:
  - name: ai-knowledge-base
    url: "https://github.com/YOUR_ORG/ai-knowledge-base.git"
    branch: main

# Vault integration for secrets
vault:
  enabled: false
  address: "http://vault.vault.svc.cluster.local:8200"
  skipTLSVerify: true
  mount: kv
  kubernetes:
    mountPath: kubernetes
    role: haystack
    serviceAccount: default
    audience: vault
    tokenTTL: 86400
  secrets:
    github: haystack/github

{{- if and .Values.httproute.enabled .Values.httproute.hostname }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "haystack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haystack.labels" . | nindent 4 }}
  {{- with (.Values.httproute).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  - name: {{ .Values.httproute.gateway.name }}
    namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
  - {{ .Values.httproute.hostname | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "haystack.fullname" . }}-hayhooks
      port: {{ .Values.service.apiPort }}
{{- end }}

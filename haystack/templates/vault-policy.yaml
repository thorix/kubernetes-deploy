{{- if .Values.vault.enabled }}
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: {{ include "haystack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haystack.labels" . | nindent 4 }}
spec:
  # Vault connection settings
  connection:
    address: {{ .Values.vault.address }}
    {{- if .Values.vault.skipTLSVerify }}
    tLSConfig:
      skipVerify: true
    {{- end }}

  # How vault-config-operator authenticates to Vault
  authentication:
    path: {{ .Values.vault.kubernetes.mountPath }}
    role: vault-config-operator

  # Policy name in Vault
  name: {{ include "haystack.fullname" . }}

  # HCL policy definition
  policy: |
    # Allow reading GitHub token
    path "{{ .Values.vault.mount }}/data/{{ .Values.vault.secrets.github }}" {
      capabilities = ["read"]
    }

    # Allow listing secrets (for metadata)
    path "{{ .Values.vault.mount }}/metadata/haystack/*" {
      capabilities = ["read", "list"]
    }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: {{ include "haystack.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haystack.labels" . | nindent 4 }}
spec:
  # Vault connection settings
  connection:
    address: {{ .Values.vault.address }}
    {{- if .Values.vault.skipTLSVerify }}
    tLSConfig:
      skipVerify: true
    {{- end }}

  # How vault-config-operator authenticates to Vault
  authentication:
    path: {{ .Values.vault.kubernetes.mountPath }}
    role: vault-config-operator

  # Kubernetes auth mount path in Vault
  path: {{ .Values.vault.kubernetes.mountPath }}

  # Role name in Vault
  name: {{ .Values.vault.kubernetes.role }}

  # Bind to service account in this namespace
  targetServiceAccounts:
    - {{ .Values.vault.kubernetes.serviceAccount }}
  targetNamespaces:
    targetNamespaces:
      - {{ .Release.Namespace }}

  # Attach policy
  policies:
    - {{ include "haystack.fullname" . }}

  # Token settings
  audience: {{ .Values.vault.kubernetes.audience }}
  tokenTTL: {{ .Values.vault.kubernetes.tokenTTL }}
{{- end }}

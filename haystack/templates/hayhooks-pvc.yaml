{{- if .Values.storage.repos.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "haystack.fullname" . }}-repos
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "haystack.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.repos.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.repos.size }}
{{- end }}
